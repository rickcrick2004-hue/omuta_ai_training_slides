<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEND 成績推移トラッカー v5.5</title>
    <!-- React & Babelのバージョンを安定版に固定 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    }
                }
            }
        }
    </script>
    <style>
        /* スクロールバーのスタイリング */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 印刷（PDF出力）用の特殊スタイル */
        @media screen {
            .print-only { display: none !important; }
        }
        @media print {
            @page { size: A4 portrait; margin: 7mm 9mm; }
            body { 
                background-color: white !important; 
                margin: 0; padding: 0; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                font-size: 10px;
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            /* 1ページ単位の厳密なシート制御 */
            .print-sheet {
                width: 100% !important;
                box-sizing: border-box !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                overflow: hidden !important;
            }
            .print-sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            
            /* 印刷時はスクロールバー非表示 */
            ::-webkit-scrollbar { display: none; }

            /* ★ 印刷時、テーブルをA4幅に収めるための強制スタイル */
            .report-table {
                width: 100% !important;
                table-layout: fixed !important;
            }
            .report-table th, .report-table td {
                min-width: 0 !important;
                width: auto !important;
                white-space: normal !important;
                word-wrap: break-word !important;
                padding-left: 2px !important;
                padding-right: 2px !important;
            }
            /* 最初の数列表の幅比率を調整 */
            .report-table th:nth-child(1), .report-table td:nth-child(1) { width: 15% !important; }
            .report-table th:nth-child(2), .report-table td:nth-child(2) { width: 11% !important; }
            .report-table th:nth-child(3), .report-table td:nth-child(3) { width: 4% !important; }

            /* ★ 印刷時、統計サマリーカードを5列で鮮明に表示するスタイル */
            .stat-card-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
                gap: 5px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ユーティリティ関数 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const normalizeName = (name) => name ? name.replace(/[\s　]+/g, '') : '';
        
        // 色付けロジック (無効化し、シンプルなテキストカラーのみを返す)
        const getScoreColor = () => {
            return 'text-slate-800';
        };

        // スコアのフォーマット (平均点・偏差値は小数第1位、それ以外は四捨五入して整数)
        const formatScore = (score, subjectName) => {
            if (score === null || score === undefined || isNaN(score)) return '-';
            const isFloat = typeof subjectName === 'string' && (subjectName.includes('平均') || subjectName.includes('偏差値'));
            return isFloat ? Number(score).toFixed(1) : Math.round(score).toString();
        };

        // 科目の固定表示順序
        const SUBJECT_ORDER = [
            // 定期試験
            '国語', '社会', '数学', '理科', '英語',
            '5教科総点', '5教科平均点', '5教科学級席次', '5教科学年席次',
            '音楽', '美術', '保体', '技家',
            '9教科総点', '9教科平均点', '9教科学級席次', '9教科学年席次',
            // 学力推移調査
            '国語点数', '国語偏差値', '国語学年順位',
            '数学点数', '数学偏差値', '数学学年順位',
            '英語点数', '英語偏差値', '英語学年順位',
            '3教科点数', '3教科偏差値', '3教科学年順位'
        ];

        // 過去のデータから「全国」という文字を取り除くためのマイグレーション関数
        const migrateRecords = (recordsToMigrate) => {
            if (!Array.isArray(recordsToMigrate)) return [];
            return recordsToMigrate.map(record => {
                const newScores = {};
                if (record.scores) {
                    Object.keys(record.scores).forEach(key => {
                        const newKey = key.replace('全国', '');
                        newScores[newKey] = record.scores[key];
                    });
                }
                return { ...record, scores: newScores };
            });
        };

        // 実技教科・9教科系かどうかの判定 (表を2段に分けるために使用)
        const isSubSubject = (subjectName) => {
            const subs = ['音楽', '美術', '保体', '技家', '9教科'];
            return subs.some(s => subjectName.includes(s));
        };

        // 折れ線グラフ用の科目別カラー・スタイル定義
        const SUBJECT_CHART_CONFIG = {
            '国語': { color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300', dot: '#ef4444', label: '国語' },
            '社会': { color: '#f97316', bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-300', dot: '#f97316', label: '社会' },
            '数学': { color: '#3b82f6', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', dot: '#3b82f6', label: '数学' },
            '理科': { color: '#10b981', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', dot: '#10b981', label: '理科' },
            '英語': { color: '#a855f7', bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-300', dot: '#a855f7', label: '英語' },
            '5教科平均点': { color: '#1e293b', bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-400', dot: '#1e293b', label: '5教科平均点', isAvg: true },
            '音楽': { color: '#ec4899', bg: 'bg-pink-50', text: 'text-pink-700', border: 'border-pink-300', dot: '#ec4899', label: '音楽' },
            '美術': { color: '#d97706', bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-300', dot: '#d97706', label: '美術' },
            '保体': { color: '#0891b2', bg: 'bg-cyan-50', text: 'text-cyan-700', border: 'border-cyan-300', dot: '#0891b2', label: '保体' },
            '技家': { color: '#4f46e5', bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-300', dot: '#4f46e5', label: '技家' },
            '9教科平均点': { color: '#1e293b', bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-400', dot: '#1e293b', label: '9教科平均点', isAvg: true },
            '国語偏差値': { color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300', dot: '#ef4444', label: '国語 (偏差値)' },
            '数学偏差値': { color: '#3b82f6', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', dot: '#3b82f6', label: '数学 (偏差値)' },
            '英語偏差値': { color: '#a855f7', bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-300', dot: '#a855f7', label: '英語 (偏差値)' },
            '3教科偏差値': { color: '#1e293b', bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-400', dot: '#1e293b', label: '3教科 (偏差値)', isAvg: true }
        };

        // 折れ線グラフ＆教科切り替えコンポーネント
        const SubjectLineChart = ({ history, chartSubjects, isDeviation, forceAllSubjects = false, isPrint = false, customSvgHeight = null }) => {
            // デフォルトですべてのグラフ（全教科＋平均点/偏差値）を選択状態にする
            const getDefaultSelectedSubs = (subjects) => {
                return subjects;
            };

            const [selectedSubs, setSelectedSubs] = useState(() => getDefaultSelectedSubs(chartSubjects));

            // 表示対象の科目リストが変化した際にデフォルト選択状態に同期
            useEffect(() => {
                setSelectedSubs(getDefaultSelectedSubs(chartSubjects));
            }, [chartSubjects.join(','), forceAllSubjects]);

            const activeSubs = forceAllSubjects ? chartSubjects : selectedSubs;

            const toggleSubject = (sub) => {
                if (forceAllSubjects) return;
                if (selectedSubs.includes(sub)) {
                    setSelectedSubs(selectedSubs.filter(s => s !== sub));
                } else {
                    setSelectedSubs([...selectedSubs, sub]);
                }
            };

            // 試験ごとのスコア取得（平均点カラムが無い場合の自動補完付き）
            const getPointValue = (record, sub) => {
                if (!record || !record.scores) return null;
                if (record.scores[sub] !== undefined && record.scores[sub] !== null && !isNaN(record.scores[sub])) {
                    return Number(record.scores[sub]);
                }
                if (sub === '5教科平均点') {
                    const five = ['国語', '社会', '数学', '理科', '英語'];
                    const vals = five.map(s => record.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                    if (vals.length === 5) return vals.reduce((a, b) => a + Number(b), 0) / 5;
                }
                if (sub === '9教科平均点') {
                    const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                    const vals = nine.map(s => record.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                    if (vals.length === 9) return vals.reduce((a, b) => a + Number(b), 0) / 9;
                }
                return null;
            };

            // Y軸の最小・最大・目盛りの計算
            const { minY, maxY, ticks } = useMemo(() => {
                if (!isDeviation) {
                    return { minY: 0, maxY: 100, ticks: [0, 20, 40, 60, 80, 100] };
                }
                let minVal = 40;
                let maxVal = 65;
                history.forEach(h => {
                    chartSubjects.forEach(sub => {
                        const v = getPointValue(h.record, sub);
                        if (v !== null) {
                            if (v < minVal) minVal = v;
                            if (v > maxVal) maxVal = v;
                        }
                    });
                });
                const floorMin = Math.max(10, Math.floor((minVal - 4) / 10) * 10);
                const ceilMax = Math.min(90, Math.ceil((maxVal + 4) / 10) * 10);
                const generatedTicks = [];
                for (let t = floorMin; t <= ceilMax; t += 10) {
                    generatedTicks.push(t);
                }
                return { minY: floorMin, maxY: ceilMax, ticks: generatedTicks };
            }, [history, chartSubjects, isDeviation]);

            // 試験名を「学年・回数」と「試験名本体」の2段に分割して横幅をコンパクトにする関数
            const formatExamLabel = (rawName) => {
                if (!rawName) return { top: '', bottom: '' };
                const cleaned = rawName.trim().replace(/[\s　]+/g, ' ');
                if (cleaned.includes(' ')) {
                    const parts = cleaned.split(' ');
                    return { top: parts[0], bottom: parts.slice(1).join('') };
                }
                const gradeMatch = cleaned.match(/^([1-3１-３]年)(.+)$/);
                if (gradeMatch) {
                    return { top: gradeMatch[1], bottom: gradeMatch[2] };
                }
                const roundMatch = cleaned.match(/^(第[0-9０-９一二三四五六七八九十]+回)(.+)$/);
                if (roundMatch) {
                    return { top: roundMatch[1], bottom: roundMatch[2] };
                }
                return { top: '', bottom: cleaned };
            };

            // 試験回数に応じた動的レイアウト計算（1回〜15回以上でも見切れず見やすい配置）
            const count = history.length;
            const isMany = count >= 10;
            const isVeryMany = count >= 13;

            const svgWidth = 780;
            const svgHeight = customSvgHeight || (isVeryMany ? 295 : 280);
            const padLeft = 44;
            const padRight = 24;
            const padTop = isPrint ? 18 : 26;
            const padBottom = isVeryMany ? (isPrint ? 46 : 60) : (isPrint ? 36 : 48);
            const plotW = svgWidth - padLeft - padRight;
            const plotH = svgHeight - padTop - padBottom;

            // 両端のラベルが見切れないようプロット領域の内側に十分な余白を確保
            const edgeOffset = useMemo(() => {
                if (count <= 1) return plotW / 2;
                if (count <= 5) return 56;
                if (count <= 8) return 46;
                if (count <= 11) return 38;
                return 32;
            }, [count, plotW]);

            const getX = (index) => {
                if (count <= 1) return padLeft + plotW / 2;
                const usableW = plotW - edgeOffset * 2;
                return padLeft + edgeOffset + (index / (count - 1)) * usableW;
            };

            const getY = (val) => {
                const ratio = (val - minY) / (maxY - minY || 1);
                return padTop + plotH - ratio * plotH;
            };

            // 平均・基準線を最後に描画して手前に表示させる
            const orderedSubjects = useMemo(() => {
                const normal = chartSubjects.filter(s => !(SUBJECT_CHART_CONFIG[s] && SUBJECT_CHART_CONFIG[s].isAvg));
                const avgs = chartSubjects.filter(s => SUBJECT_CHART_CONFIG[s] && SUBJECT_CHART_CONFIG[s].isAvg);
                return [...normal, ...avgs];
            }, [chartSubjects]);

            // 複数教科を同時表示した際、同じ試験列で数値ラベルが重ならないようにY座標を微調整するマップ
            const labelOffsetMap = useMemo(() => {
                const map = {};
                history.forEach((h, colIdx) => {
                    const colPoints = [];
                    orderedSubjects.forEach(sub => {
                        if (!activeSubs.includes(sub)) return;
                        const val = getPointValue(h.record, sub);
                        if (val !== null) {
                            colPoints.push({ sub, y: getY(val), val });
                        }
                    });
                    // Y座標（上から下）の順でソートし、近접しているラベルを上下にずらす
                    colPoints.sort((a, b) => a.y - b.y);
                    let lastLabelY = -999;
                    colPoints.forEach((pt) => {
                        let desiredY = pt.y - 8;
                        if (desiredY - lastLabelY < 10) {
                            desiredY = lastLabelY + 10;
                        }
                        // 下端・上端からはみ出さないように制限
                        desiredY = Math.max(11, Math.min(svgHeight - padBottom - 4, desiredY));
                        map[`${pt.sub}_${colIdx}`] = desiredY;
                        lastLabelY = desiredY;
                    });
                });
                return map;
            }, [history, orderedSubjects, activeSubs, minY, maxY, svgHeight, padBottom]);

            return (
                <div className={`${isPrint ? 'bg-slate-50/60 border-t border-slate-200 px-2.5 py-1.5' : 'bg-slate-50/80 border-t border-slate-200 p-3 sm:p-4'} transition-all`} onClick={e => e.stopPropagation()}>
                    {/* コントロールバー（教科ボタン＋一括切替） */}
                    <div className={`flex flex-wrap items-center justify-between gap-1.5 ${isPrint ? 'mb-1' : 'mb-2'}`}>
                        <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[10.5px] font-bold text-slate-500 mr-0.5">
                                {isPrint ? 'グラフ凡例 (太点線は平均/3教科):' : '表示教科:'}
                            </span>
                            {chartSubjects.map(sub => {
                                const cfg = SUBJECT_CHART_CONFIG[sub] || { color: '#64748b', bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-300', label: sub };
                                const isActive = activeSubs.includes(sub);
                                return (
                                    <button
                                        key={sub}
                                        type="button"
                                        onClick={() => toggleSubject(sub)}
                                        className={`${isPrint ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-0.5 text-[11px]'} rounded-full font-bold border flex items-center gap-1 transition-all ${
                                            isActive
                                                ? `${cfg.bg} ${cfg.text} ${cfg.border} shadow-sm`
                                                : 'bg-white text-slate-400 border-slate-200 opacity-60 hover:opacity-90'
                                        }`}
                                    >
                                        <span
                                            className="w-2.5 h-2.5 rounded-full shrink-0"
                                            style={{
                                                backgroundColor: isActive ? cfg.color : '#cbd5e1',
                                                border: cfg.isAvg ? '2px dashed white' : 'none'
                                            }}
                                        ></span>
                                        <span>{cfg.label}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* クイック切替ボタン */}
                        {!isPrint && (
                            <div className="flex items-center gap-1.5 ml-auto no-print">
                                <button
                                    type="button"
                                    onClick={() => setSelectedSubs(chartSubjects)}
                                    className="text-[11px] px-2 py-1 rounded bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium transition-colors"
                                >
                                    すべて表示
                                </button>
                                {chartSubjects.some(s => SUBJECT_CHART_CONFIG[s] && SUBJECT_CHART_CONFIG[s].isAvg) && (
                                    <button
                                        type="button"
                                        onClick={() => setSelectedSubs(chartSubjects.filter(s => SUBJECT_CHART_CONFIG[s] && SUBJECT_CHART_CONFIG[s].isAvg))}
                                        className="text-[11px] px-2 py-1 rounded bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium transition-colors"
                                    >
                                        {isDeviation ? '3教科のみ' : '平均点のみ'}
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={() => setSelectedSubs([])}
                                    className="text-[11px] px-2 py-1 rounded bg-white border border-slate-300 text-slate-500 hover:bg-slate-100 font-medium transition-colors"
                                >
                                    全解除
                                </button>
                            </div>
                        )}
                    </div>

                    {/* SVG 折れ線グラフ */}
                    <div className="bg-white rounded-lg border border-slate-200 p-1.5 shadow-inner overflow-x-auto">
                        <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-auto min-w-[480px] select-none">
                            {/* 横グリッド線とY軸ラベル */}
                            {ticks.map(t => {
                                const y = getY(t);
                                const isBenchmark50 = isDeviation && t === 50;
                                return (
                                    <g key={t}>
                                        <line
                                            x1={padLeft}
                                            y1={y}
                                            x2={svgWidth - padRight}
                                            y2={y}
                                            stroke={isBenchmark50 ? '#94a3b8' : '#e2e8f0'}
                                            strokeWidth={isBenchmark50 ? '1.5' : '1'}
                                            strokeDasharray={isBenchmark50 ? '4 3' : 'none'}
                                        />
                                        <text
                                            x={padLeft - 8}
                                            y={y + 4}
                                            textAnchor="end"
                                            fontSize="11"
                                            fontWeight={isBenchmark50 ? 'bold' : 'normal'}
                                            fill={isBenchmark50 ? '#475569' : '#64748b'}
                                        >
                                            {t}
                                        </text>
                                    </g>
                                );
                            })}

                            {/* 縦グリッド線とX軸（試験名）ラベル */}
                            {history.map((h, i) => {
                                const x = getX(i);
                                const { top, bottom } = formatExamLabel(h.examName);
                                const labelFontSize = isVeryMany ? '9.5' : (isMany ? '10' : '11');
                                const subFontSize = isVeryMany ? '8.5' : '9.5';
                                const baseY = svgHeight - padBottom + 15;

                                return (
                                    <g key={h.examId}>
                                        <line
                                            x1={x}
                                            y1={padTop}
                                            x2={x}
                                            y2={svgHeight - padBottom}
                                            stroke="#f1f5f9"
                                            strokeWidth="1"
                                        />
                                        {isVeryMany ? (
                                            /* 13回以上：斜め配置で15回以上でも重なりゼロ */
                                            <g transform={`translate(${x}, ${baseY + 2}) rotate(-28)`}>
                                                <text
                                                    x={0}
                                                    y={0}
                                                    textAnchor="end"
                                                    fontSize={labelFontSize}
                                                    fontWeight="bold"
                                                    fill="#334155"
                                                >
                                                    {top ? `${top} ${bottom}` : bottom}
                                                </text>
                                            </g>
                                        ) : top ? (
                                            /* 2段表示（上段：学年/回、下段：試験名）で横幅を大幅に圧縮し見切れを防止 */
                                            <g>
                                                <text
                                                    x={x}
                                                    y={baseY}
                                                    textAnchor="middle"
                                                    fontSize={subFontSize}
                                                    fontWeight="bold"
                                                    fill="#64748b"
                                                >
                                                    {top}
                                                </text>
                                                <text
                                                    x={x}
                                                    y={baseY + 13}
                                                    textAnchor="middle"
                                                    fontSize={labelFontSize}
                                                    fontWeight="bold"
                                                    fill="#334155"
                                                    style={{ letterSpacing: isMany ? '-0.5px' : '0px' }}
                                                >
                                                    {bottom}
                                                </text>
                                            </g>
                                        ) : (
                                            <text
                                                x={x}
                                                y={baseY + 8}
                                                textAnchor="middle"
                                                fontSize={labelFontSize}
                                                fontWeight="bold"
                                                fill="#334155"
                                                style={{ letterSpacing: isMany ? '-0.5px' : '0px' }}
                                            >
                                                {bottom}
                                            </text>
                                        )}
                                    </g>
                                );
                            })}

                            {/* 各科目の折れ線・ポイント・数値ラベル */}
                            {orderedSubjects.map(sub => {
                                if (!activeSubs.includes(sub)) return null;
                                const cfg = SUBJECT_CHART_CONFIG[sub] || { color: '#64748b', isAvg: false };
                                const points = [];
                                history.forEach((h, i) => {
                                    const val = getPointValue(h.record, sub);

                                        points.push({ x: getX(i), y: getY(val), val, examName: h.examName, colIdx: i });
                                    }
                                });
                                if (points.length === 0) return null;

                                const pathData = points.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                                const dotRadius = isVeryMany ? (cfg.isAvg ? '4.5' : '3.8') : (cfg.isAvg ? '5.5' : '4.5');
                                const numFontSize = isVeryMany ? (cfg.isAvg ? '9.5' : '9') : (cfg.isAvg ? '11' : '10');

                                    <g key={sub}>
                                        {points.length > 1 && (
                                            <path
                                                d={pathData}
                                                fill="none"
                                                stroke={cfg.color}
                                                strokeWidth={cfg.isAvg ? '3.5' : '2.2'}
                                                strokeDasharray={cfg.isAvg ? '6 4' : 'none'}
                                                strokeLinecap="round"
                                                strokeLinejoin="round"
                                            />
                                        )}
                                        {points.map((p, idx) => {
                                            const labelY = labelOffsetMap[`${sub}_${p.colIdx}`] !== undefined ? labelOffsetMap[`${sub}_${p.colIdx}`] : (p.y - 8);

                                                <g key={idx}>
                                                    <circle
                                                        cx={p.x}
                                                        cy={p.y}
                                                        r={dotRadius}
                                                        fill={cfg.color}
                                                        stroke="#ffffff"
                                                        strokeWidth="1.8"
                                                    />
                                                    <text

                                                        y={labelY}
                                                        textAnchor="middle"
                                                        fontSize={numFontSize}
                                                        fontWeight="bold"
                                                        fill={cfg.color}
                                                        stroke="#ffffff"
                                                        strokeWidth="3.2"
                                                        strokeLinejoin="round"
                                                        style={{ paintOrder: 'stroke' }}
                                                    >
                                                        {formatScore(p.val, sub)}
                                                    </text>
                                                </g>
                                            );

                                    </g>
                                );
                            })}

        // 特定セクション・テーブル種別からグラフ対象科目を抽出するヘルパー
        const getChartSubjectsForTable = (sectionType, subjects, tableType) => {
            if (!subjects || subjects.length === 0) return [];

                const base = ['国語', '社会', '数学', '理科', '英語'].filter(t => subjects.includes(t));

                    base.push('5教科平均点');
                }
                return base;
            }
            if (tableType === 'sub') {
                const base = ['音楽', '美術', '保体', '技家'].filter(t => subjects.includes(t));

            red: { color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300', badge: 'bg-red-600', activeBtn: 'bg-red-600 text-white shadow-sm', inactiveBtn: 'text-red-300 hover:text-white hover:bg-slate-700', lightBg: '#fee2e2' },
            blue: { color: '#2563eb', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: 'bg-blue-600', activeBtn: 'bg-blue-600 text-white shadow-sm', inactiveBtn: 'text-blue-300 hover:text-white hover:bg-slate-700', lightBg: '#dbeafe' },
            green: { color: '#10b981', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: 'bg-emerald-600', activeBtn: 'bg-emerald-600 text-white shadow-sm', inactiveBtn: 'text-emerald-300 hover:text-white hover:bg-slate-700', lightBg: '#d1fae5' }
        };

        // 期生名に含まれる数字から3年周期でカラーを返すヘルパー関数
        // 28期生(28%3=1) => 緑、29期生(29%3=2) => 赤、30期生(30%3=0) => 青
        const getCohortPalette = (cohort, fallbackIdx = 0) => {
            const rawName = cohort && cohort.name ? String(cohort.name) : '';
            const halfWidthName = rawName.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
            const match = halfWidthName.match(/(\d+)/);
            if (match) {
                const num = parseInt(match[1], 10);
                const mod = ((num % 3) + 3) % 3;
                if (mod === 1) return COHORT_CYCLE_PALETTES.green; // 28期生, 31期生...
                if (mod === 2) return COHORT_CYCLE_PALETTES.red;   // 29期生, 32期生...
                return COHORT_CYCLE_PALETTES.blue;                 // 30期生, 33期生...
            }
            const fallbackOrder = [COHORT_CYCLE_PALETTES.red, COHORT_CYCLE_PALETTES.blue, COHORT_CYCLE_PALETTES.green];
            return fallbackOrder[fallbackIdx % 3];
        };

        // クラス別のカラー定義（A組=赤、B組=青、C組=緑、全体=ダークスレート）
        const getClassPalette = (className, idx = 0) => {
            const norm = String(className || '').trim().toUpperCase();
            if (norm === 'A' || norm === '1' || norm === '１') {
                return { color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300', badge: 'bg-red-600', lightBg: '#fee2e2', label: `${className}組` };
            }
            if (norm === 'B' || norm === '2' || norm === '２') {
                return { color: '#2563eb', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: 'bg-blue-600', lightBg: '#dbeafe', label: `${className}組` };
            }
            if (norm === 'C' || norm === '3' || norm === '３') {
                return { color: '#10b981', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: 'bg-emerald-600', lightBg: '#d1fae5', label: `${className}組` };
            }
            if (norm === 'ALL' || norm === '全体') {
                return { color: '#1e293b', bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-400', badge: 'bg-slate-800', lightBg: '#f1f5f9', label: '学年全体', isAll: true };
            }
            const fallback = [
                { color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300', badge: 'bg-red-600', lightBg: '#fee2e2', label: `${className}組` },
                { color: '#2563eb', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: 'bg-blue-600', lightBg: '#dbeafe', label: `${className}組` },
                { color: '#10b981', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: 'bg-emerald-600', lightBg: '#d1fae5', label: `${className}組` },
                { color: '#f97316', bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-300', badge: 'bg-orange-500', lightBg: '#ffedd5', label: `${className}組` }
            ];
            return fallback[idx % fallback.length];
        };

        // 生徒レコードから指定科目のスコアを取得するヘルパー関数（5教科・9教科の総点・平均点の自動補完対応）
        const getStudentSubjectScore = (record, subject) => {
            if (!record || !record.scores) return null;
            if (record.scores[subject] !== undefined && record.scores[subject] !== null && !isNaN(record.scores[subject])) {
                return Number(record.scores[subject]);
            }
            if (subject === '5教科総点' || subject === '5教科平均点') {
                const five = ['国語', '社会', '数学', '理科', '英語'];
                const vals = five.map(s => record.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (vals.length === 5) {
                    const sum = vals.reduce((a, b) => a + Number(b), 0);
                    return subject === '5教科総点' ? sum : sum / 5;
                }
            }
            if (subject === '9教科総点' || subject === '9教科平均点') {
                const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                const vals = nine.map(s => record.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (vals.length === 9) {
                    const sum = vals.reduce((a, b) => a + Number(b), 0);
                    return subject === '9教科総点' ? sum : sum / 9;
                }
            }
            return null;
        };

        // 特定の試験・科目において、指定した点数/偏差値「以上(gte)」または「未満(lt)」の生徒数を算出するヘルパー関数
        const computeExamThresholdCount = (exam, allRecords, subject, operator, threshold) => {
            if (!exam) return null;
            const examRecords = allRecords.filter(r => r.examId === exam.id);
            if (examRecords.length === 0) return { matchCount: 0, validCount: 0, rate: 0 };

            let matchCount = 0;
            let validCount = 0;
            const th = Number(threshold);

            examRecords.forEach(r => {
                const val = getStudentSubjectScore(r, subject);
                if (val !== null && !isNaN(val)) {
                    validCount += 1;
                    const roundedVal = Math.round(val * 100) / 100;
                    if (operator === 'gte') {
                        if (roundedVal >= th) matchCount += 1;
                    } else if (operator === 'lt') {
                        if (roundedVal < th) matchCount += 1;
                    }
                }
            });

            return {
                matchCount,
                validCount,
                rate: validCount > 0 ? (matchCount / validCount) * 100 : 0
            };
        };

        // 特定の試験における受験者数と各科目の平均点を算出するヘルパー関数
        const computeExamSummaryStats = (exam, allRecords) => {
            if (!exam) return null;
            const examRecords = allRecords.filter(r => r.examId === exam.id);
            if (examRecords.length === 0) return { examineeCount: 0, totalStudents: 0, averages: {} };

            const isBenesse = exam.type === 'benesse';
            const coreSubjects = isBenesse ? ['国語点数', '数学点数', '英語点数'] : ['国語', '社会', '数学', '理科', '英語'];
            const examineeCount = examRecords.filter(r => coreSubjects.every(sub => r.scores && r.scores[sub] !== undefined && r.scores[sub] !== null)).length;

            const sums = {};
            const counts = {};

            examRecords.forEach(r => {
                if (!r.scores) return;
                const enriched = { ...r.scores };
                const five = ['国語', '社会', '数学', '理科', '英語'];
                const fiveVals = five.map(s => enriched[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (fiveVals.length === 5) {
                    const s5 = fiveVals.reduce((a, b) => a + Number(b), 0);
                    if (enriched['5教科総点'] === undefined) enriched['5教科総点'] = s5;
                    if (enriched['5教科平均点'] === undefined) enriched['5教科平均点'] = s5 / 5;
                }
                const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                const nineVals = nine.map(s => enriched[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (nineVals.length === 9) {
                    const s9 = nineVals.reduce((a, b) => a + Number(b), 0);
                    if (enriched['9教科総点'] === undefined) enriched['9教科総点'] = s9;
                    if (enriched['9教科平均点'] === undefined) enriched['9教科平均点'] = s9 / 9;
                }

                Object.entries(enriched).forEach(([sub, val]) => {
                    if (val !== undefined && val !== null && !isNaN(val)) {
                        sums[sub] = (sums[sub] || 0) + Number(val);
                        counts[sub] = (counts[sub] || 0) + 1;
                    }
                });
            });

            const averages = {};
            Object.keys(sums).forEach(sub => {
                if (counts[sub] > 0) {
                    averages[sub] = sums[sub] / counts[sub];
                }
            });

            return {
                examineeCount,
                totalStudents: examRecords.length,
                averages
            };
        };

        // 特定の試験・科目において、指定した基準値「以上」または「未満」の人数・割合を算出するヘルパー関数
        const computeExamThresholdStats = (exam, allRecords, subject, metricType, threshold) => {
            if (!exam || !subject) return null;
            const examRecords = allRecords.filter(r => r.examId === exam.id);
            if (examRecords.length === 0) return { count: 0, validTotal: 0, ratio: 0 };

            let matchCount = 0;
            let validTotal = 0;
            const numThreshold = Number(threshold);

            examRecords.forEach(r => {
                if (!r.scores) return;
                const enriched = { ...r.scores };
                const five = ['国語', '社会', '数学', '理科', '英語'];
                const fiveVals = five.map(s => enriched[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (fiveVals.length === 5) {
                    const s5 = fiveVals.reduce((a, b) => a + Number(b), 0);
                    if (enriched['5教科総点'] === undefined) enriched['5教科総点'] = s5;
                    if (enriched['5教科平均点'] === undefined) enriched['5教科平均点'] = s5 / 5;
                }
                const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                const nineVals = nine.map(s => enriched[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                if (nineVals.length === 9) {
                    const s9 = nineVals.reduce((a, b) => a + Number(b), 0);
                    if (enriched['9教科総点'] === undefined) enriched['9教科総点'] = s9;
                    if (enriched['9教科平均点'] === undefined) enriched['9教科平均点'] = s9 / 9;
                }

                const val = enriched[subject];
                if (val !== undefined && val !== null && !isNaN(val)) {
                    const numVal = Number(val);
                    validTotal += 1;
                    if (metricType === 'count_gte' && numVal >= numThreshold) {
                        matchCount += 1;
                    } else if (metricType === 'count_lt' && numVal < numThreshold) {
                        matchCount += 1;
                    }
                }
            });

            return {
                count: matchCount,
                validTotal,
                ratio: validTotal > 0 ? (matchCount / validTotal) * 100 : 0
            };
        };

        // --- 過年度比較（期生間比較：パターンA）コンポーネント（画面＆印刷共用） ---
        const CrossCohortComparisonView = ({
            cohorts,
            exams,
            records,
            compareConfig,
            setCompareConfig,
            isPrint = false
        }) => {
            const {
                examType,
                mode,
                selectedNormExamName,
                customExamMap,
                baseCohortId,
                trendSubject,
                trendAlignMode,
                trendMetricType = 'average', // 'average' | 'count_gte' | 'count_lt'
                trendThreshold = 80
            } = compareConfig;

            const isCountMode = trendMetricType === 'count_gte' || trendMetricType === 'count_lt';

            // 選択中の試験種別に該当する全期生の試験一覧
            const typeExams = useMemo(() => {
                return exams.filter(e => (e.type || 'regular') === examType);
            }, [exams, examType]);

            // 正規化した試験名ごとのユニークリストを生成
            const normExamList = useMemo(() => {
                const map = new Map();
                typeExams.forEach(e => {
                    const norm = normalizeName(e.name);
                    if (!map.has(norm)) {
                        map.set(norm, e.name);
                    }
                });
                return Array.from(map.entries()).map(([normName, displayName]) => ({ normName, displayName }));
            }, [typeExams]);

            // 試験種別に応じた比較対象科目リスト（席次・順位は除外）
            const compareSubjects = useMemo(() => {
                const isRank = (s) => s.includes('席次') || s.includes('順位');
                const subSet = new Set();
                typeExams.forEach(ex => {
                    records.filter(r => r.examId === ex.id).forEach(r => {
                        if (r.scores) {
                            Object.keys(r.scores).forEach(s => {
                                if (!isRank(s)) subSet.add(s);
                            });
                        }
                    });
                });

                // デフォルトの主要科目を補完
                if (examType === 'benesse') {
                    ['国語点数', '国語偏差値', '数学点数', '数学偏差値', '英語点数', '英語偏差値', '3教科点数', '3教科偏差値'].forEach(s => subSet.add(s));
                } else if (examType === 'comprehensive') {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点', '音楽', '美術', '保体', '技家', '9教科総点', '9教科平均点'].forEach(s => subSet.add(s));
                } else {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点'].forEach(s => subSet.add(s));
                }

                const arr = Array.from(subSet);
                arr.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
                return arr;
            }, [typeExams, records, examType]);

            // 通年推移で選択可能な科目リスト（学力推移調査の人数カウント時は偏差値項目のみに絞る）
            const trendSelectableSubjects = useMemo(() => {
                if (examType === 'benesse' && isCountMode) {
                    const devSubs = compareSubjects.filter(s => s.includes('偏差値'));
                    return devSubs.length > 0 ? devSubs : ['国語偏差値', '数学偏差値', '英語偏差値', '3教科偏差値'];
                }
                return compareSubjects;
            }, [compareSubjects, examType, isCountMode]);

            // 10点刻み／偏差値10刻みの選択肢リスト
            const thresholdOptions = useMemo(() => {
                if (examType === 'benesse') {
                    return [30, 40, 50, 60, 70, 80];
                }
                if (trendSubject === '5教科総点') {
                    return Array.from({ length: 49 }, (_, i) => (i + 1) * 10); // 10〜490点 (10点刻み)
                }
                if (trendSubject === '9教科総点') {
                    return Array.from({ length: 89 }, (_, i) => (i + 1) * 10); // 10〜890点 (10点刻み)
                }
                return [10, 20, 30, 40, 50, 60, 70, 80, 90];
            }, [examType, trendSubject]);

            // 棒グラフで表示する科目（100点満点系または偏差値系）
            const barChartSubjects = useMemo(() => {
                if (examType === 'benesse') {
                    return ['国語偏差値', '数学偏差値', '英語偏差値', '3教科偏差値'].filter(s => compareSubjects.includes(s));
                }
                if (examType === 'comprehensive') {
                    return ['国語', '社会', '数学', '理科', '英語', '5教科平均点', '音楽', '美術', '保体', '技家', '9教科平均点'].filter(s => compareSubjects.includes(s));
                }
                return ['国語', '社会', '数学', '理科', '英語', '5教科平均点'].filter(s => compareSubjects.includes(s));
            }, [examType, compareSubjects]);

            // 初期試験の自動選択と同期
            useEffect(() => {
                if (normExamList.length > 0) {
                    const exists = normExamList.some(item => item.normName === selectedNormExamName);
                    if (!selectedNormExamName || !exists) {
                        const firstNorm = normExamList[0].normName;
                        const newMap = {};
                        cohorts.forEach(c => {
                            const matched = typeExams.find(e => (e.cohortId || cohorts[0]?.id) === c.id && normalizeName(e.name) === firstNorm);
                            newMap[c.id] = matched ? matched.id : '';
                        });
                        setCompareConfig(prev => ({
                            ...prev,
                            selectedNormExamName: firstNorm,
                            customExamMap: newMap,
                            baseCohortId: prev.baseCohortId || (cohorts[0] ? cohorts[0].id : '')
                        }));
                    }
                }
            }, [normExamList, examType, cohorts]);

            // 通年推移の科目および基準値（しきい値）の自動補正
            useEffect(() => {
                let nextSubject = trendSubject;
                if (trendSelectableSubjects.length > 0 && !trendSelectableSubjects.includes(trendSubject)) {
                    if (examType === 'benesse') {
                        const mappedDev = trendSubject.replace('点数', '偏差値');
                        if (trendSelectableSubjects.includes(mappedDev)) {
                            nextSubject = mappedDev;
                        } else {
                            nextSubject = trendSelectableSubjects.includes('3教科偏差値') ? '3教科偏差値' : trendSelectableSubjects[0];
                        }
                    } else {
                        nextSubject = trendSelectableSubjects.includes('5教科平均点') ? '5教科平均点' : trendSelectableSubjects[0];
                    }
                }

                let nextThreshold = trendThreshold;
                if (!thresholdOptions.includes(Number(trendThreshold))) {
                    if (examType === 'benesse') {
                        nextThreshold = trendMetricType === 'count_lt' ? 40 : 60;
                    } else if (nextSubject === '5教科総点') {
                        nextThreshold = trendMetricType === 'count_lt' ? 250 : 400;
                    } else if (nextSubject === '9教科総点') {
                        nextThreshold = trendMetricType === 'count_lt' ? 450 : 720;
                    } else {
                        nextThreshold = trendMetricType === 'count_lt' ? 50 : 80;
                    }
                }

                if (nextSubject !== trendSubject || nextThreshold !== trendThreshold) {
                    setCompareConfig(prev => ({
                        ...prev,
                        trendSubject: nextSubject,
                        trendThreshold: nextThreshold
                    }));
                }
            }, [trendSelectableSubjects, thresholdOptions, trendSubject, trendThreshold, examType, trendMetricType]);

            // 試験名ボタンをクリックした際に全期生の該当試験を一括セット
            const handleSelectNormExam = (normName) => {
                const newMap = {};
                cohorts.forEach(c => {
                    const matched = typeExams.find(e => (e.cohortId || cohorts[0]?.id) === c.id && normalizeName(e.name) === normName);
                    newMap[c.id] = matched ? matched.id : '';
                });
                setCompareConfig(prev => ({
                    ...prev,
                    selectedNormExamName: normName,
                    customExamMap: newMap
                }));
            };

            // 各期生の試験別データ算出（モード①用）
            const singleComparisonRows = useMemo(() => {
                return cohorts.map((cohort, idx) => {
                    const palette = getCohortPalette(cohort, idx);
                    const cohortExams = typeExams.filter(e => (e.cohortId || cohorts[0]?.id) === cohort.id);
                    const targetExamId = customExamMap[cohort.id];
                    const exam = cohortExams.find(e => e.id === targetExamId) || null;
                    const stats = exam ? computeExamSummaryStats(exam, records) : null;
                    return {
                        cohort,
                        palette,
                        cohortExams,
                        exam,
                        stats
                    };
                });
            }, [cohorts, typeExams, customExamMap, records]);

            const activeSingleRows = useMemo(() => {
                return singleComparisonRows.filter(r => r.exam && r.stats && r.stats.totalStudents > 0);
            }, [singleComparisonRows]);

            const baseRow = useMemo(() => {
                return activeSingleRows.find(r => r.cohort.id === baseCohortId) || activeSingleRows[0] || null;
            }, [activeSingleRows, baseCohortId]);

            // 通年推移データ算出（モード②用）
            const trendAxisItems = useMemo(() => {
                if (trendAlignMode === 'order') {
                    let maxCount = 0;
                    cohorts.forEach(c => {
                        const cnt = typeExams.filter(e => (e.cohortId || cohorts[0]?.id) === c.id).length;
                        if (cnt > maxCount) maxCount = cnt;
                    });
                    return Array.from({ length: maxCount }, (_, i) => ({
                        key: `order_${i}`,
                        label: `第${i + 1}回`,
                        index: i
                    }));
                } else {
                    return normExamList.map((item, i) => ({
                        key: item.normName,
                        label: item.displayName,
                        normName: item.normName,
                        index: i
                    }));
                }
            }, [trendAlignMode, cohorts, typeExams, normExamList]);

            const trendSeries = useMemo(() => {
                return cohorts.map((cohort, idx) => {
                    const palette = getCohortPalette(cohort, idx);
                    const cohortExams = typeExams.filter(e => (e.cohortId || cohorts[0]?.id) === cohort.id);
                    const points = trendAxisItems.map((axisItem) => {
                        let targetExam = null;
                        if (trendAlignMode === 'order') {
                            targetExam = cohortExams[axisItem.index] || null;
                        } else {
                            targetExam = cohortExams.find(e => normalizeName(e.name) === axisItem.normName) || null;
                        }
                        if (!targetExam) return { axisKey: axisItem.key, val: null, examName: null };

                        if (isCountMode) {
                            const thStats = computeExamThresholdStats(targetExam, records, trendSubject, trendMetricType, trendThreshold);
                            return {
                                axisKey: axisItem.key,
                                val: thStats ? thStats.count : null,
                                validTotal: thStats ? thStats.validTotal : 0,
                                ratio: thStats ? thStats.ratio : 0,
                                examName: targetExam.name
                            };
                        } else {
                            const st = computeExamSummaryStats(targetExam, records);
                            const val = st && st.averages[trendSubject] !== undefined ? st.averages[trendSubject] : null;
                            return {
                                axisKey: axisItem.key,
                                val,
                                examName: targetExam.name,
                                examineeCount: st ? st.examineeCount : 0
                            };
                        }
                    });
                    return {
                        cohort,
                        palette,
                        points
                    };
                });
            }, [cohorts, typeExams, trendAxisItems, trendAlignMode, records, trendSubject, isCountMode, trendMetricType, trendThreshold]);

            const typeTitle = examType === 'regular' ? '定期試験' : (examType === 'benesse' ? '学力推移調査' : '学期総合');
            const metricUnitLabel = examType === 'benesse' ? `偏差値${trendThreshold}` : `${trendThreshold}点`;
            const trendConditionSummary = isCountMode
                ? `${trendSubject.replace('偏差値', '')}（${metricUnitLabel}${trendMetricType === 'count_gte' ? '以上' : '未満'}の人数）`
                : `${trendSubject}（平均推移）`;

            return (

                                                    type="button"

                                                    className={`px-2.5 py-1 rounded text-xs font-bold transition-all ${
                                                        trendMetricType === 'average'
                                                            ? 'bg-blue-600 text-white shadow-sm'

                                                >
                                                    📈 {examType === 'benesse' ? '平均点・平均偏差値の推移' : '平均点の推移'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setCompareConfig(prev => ({
                                                        ...prev,
                                                        trendMetricType: 'count_gte',
                                                        trendThreshold: examType === 'benesse' ? 60 : (prev.trendSubject === '5教科総点' ? 400 : (prev.trendSubject === '9教科総点' ? 720 : 80))
                                                    }))}
                                                    className={`px-2.5 py-1 rounded text-xs font-bold transition-all ${
                                                        trendMetricType === 'count_gte'
                                                            ? 'bg-emerald-600 text-white shadow-sm'
                                                            : 'text-slate-600 hover:bg-white/70'
                                                    }`}
                                                >
                                                    ⬆️ {examType === 'benesse' ? '指定偏差値「以上」の人数' : '指定点数「以上」の人数'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setCompareConfig(prev => ({
                                                        ...prev,
                                                        trendMetricType: 'count_lt',
                                                        trendThreshold: examType === 'benesse' ? 40 : (prev.trendSubject === '5教科総点' ? 250 : (prev.trendSubject === '9教科総点' ? 450 : 50))

                                                        trendMetricType === 'count_lt'

                                                            : 'text-slate-600 hover:bg-white/70'
                                                    }`}
                                                >

                                        </div>

                                        <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs">
                                            <button
                                                type="button"
                                                onClick={() => setCompareConfig(prev => ({ ...prev, trendAlignMode: 'name' }))}
                                                className={`px-2.5 py-1 rounded font-bold transition-colors ${trendAlignMode === 'name' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}
                                            >

                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCompareConfig(prev => ({ ...prev, trendAlignMode: 'order' }))}
                                                className={`px-2.5 py-1 rounded font-bold transition-colors ${trendAlignMode === 'order' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}
                                            >

                                            </button>
                                        </div>

                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-xs font-bold text-slate-500 mr-1">対象科目:</span>
                                        {trendSelectableSubjects.map(sub => {
                                            const displayLabel = (examType === 'benesse' && isCountMode) ? sub.replace('偏差値', '') : sub;
                                            return (
                                                <button
                                                    key={sub}
                                                    type="button"
                                                    onClick={() => setCompareConfig(prev => ({ ...prev, trendSubject: sub }))}
                                                    className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-all ${
                                                        trendSubject === sub
                                                            ? 'bg-slate-800 text-white border-slate-800 shadow-sm'
                                                            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {displayLabel}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* 10点刻み／偏差値10刻みの基準値セレクター（人数推移モード時のみ表示） */}
                                    {isCountMode && (
                                        <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                            <span className="text-xs font-bold text-slate-700">
                                                {examType === 'benesse' ? '基準偏差値（10刻み）:' : '基準点数（10点刻み）:'}
                                            </span>
                                            {thresholdOptions.length <= 12 ? (
                                                <div className="flex flex-wrap items-center gap-1.5">
                                                    {thresholdOptions.map(val => {
                                                        const active = Number(trendThreshold) === val;
                                                        const activeColor = trendMetricType === 'count_gte'
                                                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm'
                                                            : 'bg-rose-600 text-white border-rose-600 shadow-sm';
                                                        return (
                                                            <button
                                                                key={val}
                                                                type="button"
                                                                onClick={() => setCompareConfig(prev => ({ ...prev, trendThreshold: val }))}
                                                                className={`px-3 py-1 rounded-md text-xs font-extrabold border transition-all ${
                                                                    active ? activeColor : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                                                                }`}
                                                            >
                                                                {examType === 'benesse' ? `偏差値 ${val}` : `${val}点`}
                                                                {trendMetricType === 'count_gte' ? ' 以上' : ' 未満'}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            ) : (
                                                <div className="flex flex-wrap items-center gap-2">
                                                    <select
                                                        value={trendThreshold}
                                                        onChange={e => setCompareConfig(prev => ({ ...prev, trendThreshold: Number(e.target.value) }))}
                                                        className="text-xs font-extrabold border border-slate-300 rounded-md px-3 py-1.5 bg-white text-slate-800 outline-none focus:border-blue-500"
                                                    >
                                                        {thresholdOptions.map(val => (
                                                            <option key={val} value={val}>
                                                                {val}点 {trendMetricType === 'count_gte' ? '以上' : '未満'}
                                                            </option>
                                                        ))}
                                                    </select>
                                                    <span className="text-[11px] text-slate-500">（10点刻みで選択可能）</span>

                                        </div>

                            )}
                        </div>
                    )}

                    {/* --- モード①：試験別の期生間比較表示 --- */}
                    {mode === 'single' && (
                        <div className="space-y-4">
                            {/* 1. 期生別 平均点・比較一覧表 */}
                            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                <div className="px-4 py-2.5 bg-slate-800 text-white flex flex-wrap justify-between items-center gap-2">
                                    <span className="text-xs sm:text-sm font-bold flex items-center gap-2">
                                        📊 期生別 平均点・受験者数 比較テーブル
                                    </span>
                                    {baseRow && (
                                        <span className="text-[11px] text-amber-300 font-bold">
                                            ★ 括弧内の数値は基準「{baseRow.cohort.name}（{baseRow.exam?.name}）」との差
                                        </span>
                                    )}
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="report-table w-full text-xs text-center whitespace-nowrap border-separate border-spacing-0">
                                        <thead className="bg-slate-100 text-slate-600">
                                            <tr>
                                                <th className="px-3 py-2 text-left font-bold border-b border-slate-200 sticky left-0 bg-slate-100 z-20 min-w-[95px]">期生</th>
                                                <th className="px-3 py-2 text-left font-bold border-b border-slate-200 min-w-[120px]">対象試験名</th>
                                                <th className="px-2 py-2 font-bold border-b border-slate-200 min-w-[68px]">受験者数</th>
                                                {compareSubjects.map(sub => (
                                                    <th key={sub} className="px-2 py-2 font-bold border-b border-slate-200 min-w-[74px]">{sub}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {activeSingleRows.length === 0 ? (
                                                <tr>
                                                    <td colSpan={compareSubjects.length + 3} className="py-8 text-slate-400 text-center">
                                                        比較対象の試験データがある期生がありません。上の選択欄から各期生の試験を選択してください。
                                                    </td>
                                                </tr>
                                            ) : (
                                                activeSingleRows.map(row => {
                                                    const isBase = baseRow && baseRow.cohort.id === row.cohort.id;
                                                    return (
                                                        <tr key={row.cohort.id} className={`${isBase ? 'bg-amber-50/40' : 'hover:bg-slate-50'} transition-colors`}>
                                                            <td className="px-3 py-2.5 text-left font-extrabold sticky left-0 bg-white z-10 border-b border-slate-100">
                                                                <div className="flex items-center gap-1.5">
                                                                    <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: row.palette.color }}></span>
                                                                    <span className="text-slate-800 text-[13px]">{row.cohort.name}</span>
                                                                    {isBase && <span className="text-[9.5px] bg-amber-400 text-slate-900 px-1.5 py-0.5 rounded font-extrabold">基準</span>}
                                                                </div>
                                                            </td>
                                                            <td className="px-3 py-2.5 text-left font-bold text-slate-600 border-b border-slate-100">
                                                                {row.exam.name}
                                                            </td>
                                                            <td className="px-2 py-2.5 font-mono font-bold text-slate-700 border-b border-slate-100 border-r">
                                                                {row.stats.examineeCount}名
                                                            </td>
                                                            {compareSubjects.map(sub => {
                                                                const val = row.stats.averages[sub];
                                                                const baseVal = baseRow && baseRow.stats ? baseRow.stats.averages[sub] : undefined;
                                                                const diff = (!isBase && val !== undefined && baseVal !== undefined) ? (val - baseVal) : null;
                                                                return (
                                                                    <td key={sub} className="px-2 py-2 border-b border-l border-slate-100">
                                                                        <div className="flex flex-col items-center justify-center leading-tight">
                                                                            <span className="text-[13.5px] font-extrabold text-slate-800 font-mono">
                                                                                {val !== undefined ? Number(val).toFixed(1) : '-'}
                                                                            </span>
                                                                            {diff !== null && (
                                                                                <span className={`text-[10.5px] font-bold mt-0.5 ${diff > 0.04 ? 'text-blue-600' : (diff < -0.04 ? 'text-red-500' : 'text-slate-400')}`}>
                                                                                    ({diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1)})
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* 2. 期生別 教科ごと平均点（偏差値）グループ棒グラフ */}
                            {activeSingleRows.length > 0 && barChartSubjects.length > 0 && (() => {
                                const isDev = examType === 'benesse';
                                const minY = isDev ? 30 : 0;
                                const maxY = isDev ? 80 : 100;
                                const ticks = isDev ? [30, 40, 50, 60, 70, 80] : [0, 20, 40, 60, 80, 100];
                                const svgW = 780;
                                const svgH = isPrint ? 250 : 280;
                                const padL = 44;
                                const padR = 24;
                                const padT = 26;
                                const padB = 42;
                                const plotW = svgW - padL - padR;
                                const plotH = svgH - padT - padB;
                                const groupCount = barChartSubjects.length;
                                const groupW = plotW / groupCount;
                                const cohortCount = activeSingleRows.length;
                                const barW = Math.min(28, Math.max(10, (groupW * 0.72) / cohortCount));

                                const getY = (v) => {
                                    const clamped = Math.max(minY, Math.min(maxY, v));
                                    return padT + plotH - ((clamped - minY) / (maxY - minY)) * plotH;
                                };

                                return (
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 sm:p-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                            <h4 className="text-xs sm:text-sm font-bold text-slate-700">
                                                📈 教科別 期生間比較グラフ（{isDev ? '平均偏差値' : '平均点'}）
                                            </h4>
                                            <div className="flex flex-wrap items-center gap-3">
                                                {activeSingleRows.map(r => (
                                                    <span key={r.cohort.id} className="inline-flex items-center gap-1.5 text-xs font-bold text-slate-700">
                                                        <span className="w-3 h-3 rounded-sm" style={{ backgroundColor: r.palette.color }}></span>
                                                        {r.cohort.name}（{r.exam.name}）
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto min-w-[500px] select-none">
                                                {ticks.map(t => {
                                                    const y = getY(t);
                                                    return (
                                                        <g key={t}>
                                                            <line x1={padL} y1={y} x2={svgW - padR} y2={y} stroke={t === 50 && isDev ? '#94a3b8' : '#e2e8f0'} strokeWidth="1" strokeDasharray={t === 50 && isDev ? '4 3' : 'none'} />
                                                            <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#64748b">{t}</text>
                                                        </g>
                                                    );
                                                })}
                                                {barChartSubjects.map((sub, gIdx) => {
                                                    const centerX = padL + gIdx * groupW + groupW / 2;
                                                    const totalBarsW = cohortCount * barW + (cohortCount - 1) * 3;
                                                    const startX = centerX - totalBarsW / 2;
                                                    return (
                                                        <g key={sub}>
                                                            {activeSingleRows.map((row, cIdx) => {
                                                                const val = row.stats.averages[sub];
                                                                if (val === undefined || val === null) return null;
                                                                const x = startX + cIdx * (barW + 3);
                                                                const y = getY(val);
                                                                const h = Math.max(2, padT + plotH - y);
                                                                return (
                                                                    <g key={row.cohort.id}>
                                                                        <rect x={x} y={y} width={barW} height={h} rx="3" fill={row.palette.color} opacity="0.9" />
                                                                        <text
                                                                            x={x + barW / 2}
                                                                            y={y - 5}
                                                                            textAnchor="middle"
                                                                            fontSize={cohortCount >= 4 ? '9' : '10'}
                                                                            fontWeight="bold"
                                                                            fill={row.palette.color}
                                                                        >
                                                                            {Number(val).toFixed(1)}
                                                                        </text>
                                                                    </g>
                                                                );
                                                            })}
                                                            <text x={centerX} y={svgH - padB + 20} textAnchor="middle" fontSize="11.5" fontWeight="bold" fill="#334155">
                                                                {sub}
                                                            </text>
                                                        </g>
                                                    );
                                                })}
                                            </svg>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    {/* --- モード②：通年推移の期生間比較表示 --- */}
                    {mode === 'trend' && (
                        <div className="space-y-4">
                            {/* 1. 通年推移 折れ線グラフ */}
                            {(() => {
                                let minY = 0, maxY = 100, step = 20;

                                if (isCountMode) {
