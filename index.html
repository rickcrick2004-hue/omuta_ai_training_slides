                                    let maxCountVal = 10;
                                    trendSeries.forEach(s => {
                                        s.points.forEach(pt => {
                                            if (pt.val !== null && pt.val !== undefined && pt.val > maxCountVal) {
                                                maxCountVal = pt.val;
                                            }
                                        });
                                    });
                                    minY = 0;
                                    if (maxCountVal <= 10) { maxY = 10; step = 2; }
                                    else if (maxCountVal <= 25) { maxY = Math.ceil(maxCountVal / 5) * 5; step = 5; }
                                    else if (maxCountVal <= 50) { maxY = Math.ceil(maxCountVal / 10) * 10; step = 10; }
                                    else if (maxCountVal <= 100) { maxY = Math.ceil(maxCountVal / 20) * 20; step = 20; }
                                    else {
                                        step = Math.ceil(maxCountVal / 5 / 10) * 10;
                                        maxY = Math.ceil(maxCountVal / step) * step;
                                    }
                                } else {
                                    const isDev = trendSubject.includes('偏差値');
                                    const isTotal5 = trendSubject === '5教科総点';
                                    const isTotal9 = trendSubject === '9教科総点';
                                    const isTotal3 = trendSubject === '3教科点数';

                                    if (isDev) { minY = 30; maxY = 80; step = 10; }
                                    else if (isTotal5) { minY = 100; maxY = 450; step = 50; }
                                    else if (isTotal9) { minY = 200; maxY = 850; step = 100; }
                                    else if (isTotal3) { minY = 50; maxY = 300; step = 50; }
                                }

                                const ticks = [];
                                for (let t = minY; t <= maxY; t += step) ticks.push(t);

                                const svgW = 780;
                                const svgH = isPrint ? 260 : 295;
                                const padL = 52;
                                const padR = 26;
                                const padT = 26;
                                const padB = 50;
                                const plotW = svgW - padL - padR;
                                const plotH = svgH - padT - padB;
                                const count = trendAxisItems.length;

                                const getX = (i) => {
                                    if (count <= 1) return padL + plotW / 2;
                                    const offset = count <= 6 ? 48 : 34;
                                    return padL + offset + (i / (count - 1)) * (plotW - offset * 2);
                                };
                                const getY = (v) => {
                                    const clamped = Math.max(minY, Math.min(maxY, v));
                                    return padT + plotH - ((clamped - minY) / (maxY - minY || 1)) * plotH;
                                };

                                return (
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 sm:p-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                            <h4 className="text-xs sm:text-sm font-bold text-slate-700">
                                                📈 期生間 通年推移グラフ：【{trendConditionSummary}】
                                            </h4>
                                            <div className="flex flex-wrap items-center gap-3">
                                                {trendSeries.map(s => (
                                                    <span key={s.cohort.id} className="inline-flex items-center gap-1.5 text-xs font-bold text-slate-700">
                                                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: s.palette.color }}></span>
                                                        {s.cohort.name}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        {count === 0 ? (
                                            <div className="py-10 text-center text-slate-400 text-xs">試験データがありません</div>
                                        ) : (
                                            <div className="overflow-x-auto">
                                                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto min-w-[500px] select-none">
                                                    {ticks.map(t => {
                                                        const y = getY(t);
                                                        return (
                                                            <g key={t}>
                                                                <line x1={padL} y1={y} x2={svgW - padR} y2={y} stroke="#e2e8f0" strokeWidth="1" />
                                                                <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#64748b">
                                                                    {isCountMode ? `${t}人` : t}
                                                                </text>
                                                            </g>
                                                        );
                                                    })}
                                                    {trendAxisItems.map((item, i) => {
                                                        const x = getX(i);
                                                        return (
                                                            <g key={item.key}>
                                                                <line x1={x} y1={padT} x2={x} y2={svgH - padB} stroke="#f1f5f9" strokeWidth="1" />
                                                                <text x={x} y={svgH - padB + 20} textAnchor="middle" fontSize="10.5" fontWeight="bold" fill="#334155">
                                                                    {item.label}
                                                                </text>
                                                            </g>
                                                        );
                                                    })}
                                                    {trendSeries.map((series, sIdx) => {
                                                        const validPts = [];
                                                        series.points.forEach((pt, i) => {
                                                            if (pt.val !== null && pt.val !== undefined) {
                                                                validPts.push({ x: getX(i), y: getY(pt.val), val: pt.val, idx: i });
                                                            }
                                                        });
                                                        if (validPts.length === 0) return null;
                                                        const pathD = validPts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                                                        return (
                                                            <g key={series.cohort.id}>
                                                                {validPts.length > 1 && (
                                                                    <path d={pathD} fill="none" stroke={series.palette.color} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" />
                                                                )}
                                                                {validPts.map((p, idx) => (
                                                                    <g key={idx}>
                                                                        <circle cx={p.x} cy={p.y} r="4.5" fill={series.palette.color} stroke="#fff" strokeWidth="1.8" />
                                                                        <text
                                                                            x={p.x}
                                                                            y={p.y - 8 - (sIdx % 2) * 4}
                                                                            textAnchor="middle"
                                                                            fontSize="10.5"
                                                                            fontWeight="bold"
                                                                            fill={series.palette.color}
                                                                            stroke="#ffffff"
                                                                            strokeWidth="3"
                                                                            style={{ paintOrder: 'stroke' }}
                                                                        >
                                                                            {isCountMode ? `${Math.round(p.val)}人` : Number(p.val).toFixed(1)}
                                                                        </text>
                                                                    </g>
                                                                ))}
                                                            </g>
                                                        );
                                                    })}
                                                </svg>
                                            </div>
                                        )}
                                    </div>
                                );
                            })()}

                            {/* 2. 通年推移 マトリクス表 */}
                            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                <div className="px-4 py-2.5 bg-slate-800 text-white flex justify-between items-center">
                                    <span className="text-xs sm:text-sm font-bold">
                                        📋 【{trendConditionSummary}】期生別・試験別 推移一覧表
                                    </span>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="report-table w-full text-xs text-center whitespace-nowrap border-separate border-spacing-0">
                                        <thead className="bg-slate-100 text-slate-600">
                                            <tr>
                                                <th className="px-3 py-2 text-left font-bold border-b border-slate-200 sticky left-0 bg-slate-100 z-10 min-w-[95px]">期生</th>
                                                {trendAxisItems.map(item => (
                                                    <th key={item.key} className="px-2.5 py-2 font-bold border-b border-slate-200 min-w-[90px]">{item.label}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {trendSeries.map(series => (
                                                <tr key={series.cohort.id} className="hover:bg-slate-50">
                                                    <td className="px-3 py-2.5 text-left font-extrabold sticky left-0 bg-white z-10 border-b border-slate-100">
                                                        <div className="flex items-center gap-1.5">
                                                            <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: series.palette.color }}></span>
                                                            <span className="text-slate-800">{series.cohort.name}</span>
                                                        </div>
                                                    </td>
                                                    {series.points.map(pt => (
                                                        <td key={pt.axisKey} className="px-2.5 py-2 border-b border-l border-slate-100">
                                                            {pt.val !== null ? (
                                                                <div className="flex flex-col items-center">
                                                                    <span className="text-[13px] font-extrabold text-slate-800 font-mono">
                                                                        {isCountMode ? `${Math.round(pt.val)}人` : Number(pt.val).toFixed(1)}
                                                                    </span>
                                                                    {isCountMode && pt.validTotal > 0 && (
                                                                        <span className="text-[9.5px] text-slate-500 font-medium">
                                                                            ({pt.ratio.toFixed(1)}% / {pt.validTotal}名)
                                                                        </span>
                                                                    )}
                                                                    {trendAlignMode === 'order' && pt.examName && (
                                                                        <span className="text-[9.5px] text-slate-400 truncate max-w-[85px]">{pt.examName}</span>
                                                                    )}
                                                                </div>
                                                            ) : (
                                                                <span className="text-slate-300">-</span>
                                                            )}
                                                        </td>
                                                    ))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 統計計算用ヘルパー関数群（クラス間比較用） ---
        const calcArrayStats = (values) => {
            if (!values || values.length === 0) return null;
            const sorted = [...values].sort((a, b) => a - b);
            const count = sorted.length;
            const sum = sorted.reduce((acc, v) => acc + v, 0);
            const avg = sum / count;
            const mid = Math.floor(count / 2);
            const median = count % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
            const max = sorted[count - 1];
            const min = sorted[0];
            const variance = sorted.reduce((acc, v) => acc + Math.pow(v - avg, 2), 0) / count;
            const stdDev = Math.sqrt(variance);
            return { count, avg, median, max, min, stdDev };
        };

        // --- 同一期生内 クラス間比較（A組 vs B組など）コンポーネント（画面＆印刷共用） ---
        const ClassComparisonView = ({
            cohorts,
            currentCohort,
            onSelectCohort,
            cohortExams,
            records,
            classCompareConfig,
            setClassCompareConfig,
            isPrint = false
        }) => {
            const {
                examType = 'regular',
                mode = 'single',               // 'single' (試験別詳細比較) | 'trend' (通年推移比較)
                selectedExamId = '',
                singleSubTab = 'overview',     // 'overview' | 'distribution' | 'top_share'
                overviewStatKey = 'avg',       // 棒グラフで表示する指標: 'avg' | 'median' | 'max' | 'min' | 'stdDev' | 'highRate' | 'lowRate'
                distSubject = '5教科平均点',
                trendSubject = '5教科平均点',
                trendMetricType = 'average',   // 'average' | 'median' | 'count_gte' | 'rate_gte' | 'count_lt' | 'rate_lt' | 'top_n'
                trendThreshold = 80,
                trendTopN = 20
            } = classCompareConfig;

            // 選択中の試験種別に該当する期生内試験リスト
            const typeExams = useMemo(() => {
                return cohortExams.filter(e => (e.type || 'regular') === examType);
            }, [cohortExams, examType]);

            // 選択中の試験オブジェクト（未選択時は最新試験）
            const activeExam = useMemo(() => {
                if (typeExams.length === 0) return null;
                return typeExams.find(e => e.id === selectedExamId) || typeExams[typeExams.length - 1];
            }, [typeExams, selectedExamId]);

            // 試験種別が変わった際に対象試験IDを同期
            useEffect(() => {
                if (typeExams.length > 0 && (!selectedExamId || !typeExams.some(e => e.id === selectedExamId))) {
                    setClassCompareConfig(prev => ({
                        ...prev,
                        selectedExamId: typeExams[typeExams.length - 1].id
                    }));
                }
            }, [typeExams, selectedExamId]);

            // 期生内に存在するクラス一覧を抽出（デフォルトは ['A', 'B']）
            const detectedClasses = useMemo(() => {
                const clsSet = new Set();
                const targetExamIds = new Set(typeExams.map(e => e.id));
                records.forEach(r => {
                    if (targetExamIds.has(r.examId) && r.class) {
                        clsSet.add(String(r.class).trim());
                    }
                });
                const sorted = Array.from(clsSet).sort();
                return sorted.length > 0 ? sorted : ['A', 'B'];
            }, [typeExams, records]);

            // 比較対象科目リスト（席次・順位は除く）
            const compareSubjects = useMemo(() => {
                const isRank = (s) => s.includes('席次') || s.includes('順位');
                const subSet = new Set();
                typeExams.forEach(ex => {
                    records.filter(r => r.examId === ex.id).forEach(r => {
                        if (r.scores) {
                            Object.keys(r.scores).forEach(s => {
                                if (!isRank(s)) subSet.add(s);
                            });
                        }
                    });
                });
                if (examType === 'benesse') {
                    ['国語点数', '国語偏差値', '数学点数', '数学偏差値', '英語点数', '英語偏差値', '3教科点数', '3教科偏差値'].forEach(s => subSet.add(s));
                } else if (examType === 'comprehensive') {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点', '音楽', '美術', '保体', '技家', '9教科総点', '9教科平均点'].forEach(s => subSet.add(s));
                } else {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点'].forEach(s => subSet.add(s));
                }
                const arr = Array.from(subSet);
                arr.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
                return arr;
            }, [typeExams, records, examType]);

            // 棒グラフ対象科目（100点満点系または偏差値系）
            const chartSubjects = useMemo(() => {
                if (examType === 'benesse') {
                    return ['国語偏差値', '数学偏差値', '英語偏差値', '3教科偏差値'].filter(s => compareSubjects.includes(s));
                }
                if (examType === 'comprehensive') {
                    return ['国語', '社会', '数学', '理科', '英語', '5教科平均点', '音楽', '美術', '保体', '技家', '9教科平均点'].filter(s => compareSubjects.includes(s));
                }
                return ['国語', '社会', '数学', '理科', '英語', '5教科平均点'].filter(s => compareSubjects.includes(s));
            }, [examType, compareSubjects]);

            // 科目選択の自動補正
            useEffect(() => {
                let nextDist = distSubject;
                let nextTrend = trendSubject;
                const defaultSub = examType === 'benesse' ? '3教科偏差値' : '5教科平均点';
                if (compareSubjects.length > 0 && !compareSubjects.includes(distSubject)) {
                    nextDist = compareSubjects.includes(defaultSub) ? defaultSub : compareSubjects[0];
                }
                if (compareSubjects.length > 0 && !compareSubjects.includes(trendSubject)) {
                    nextTrend = compareSubjects.includes(defaultSub) ? defaultSub : compareSubjects[0];
                }
                if (nextDist !== distSubject || nextTrend !== trendSubject) {
                    setClassCompareConfig(prev => ({
                        ...prev,
                        distSubject: nextDist,
                        trendSubject: nextTrend
                    }));
                }
            }, [compareSubjects, distSubject, trendSubject, examType]);

            // 特定の試験・クラスにおける全科目の詳細統計を計算する関数
            const computeClassStatsForExam = (exam, classFilter) => {
                if (!exam) return null;
                let examRecords = records.filter(r => r.examId === exam.id);
                if (classFilter !== 'ALL') {
                    examRecords = examRecords.filter(r => String(r.class).trim() === classFilter);
                }
                const isBenesse = exam.type === 'benesse';
                const coreSubjects = isBenesse ? ['国語点数', '数学点数', '英語点数'] : ['国語', '社会', '数学', '理科', '英語'];
                const examineeCount = examRecords.filter(r => coreSubjects.every(sub => r.scores && r.scores[sub] !== undefined && r.scores[sub] !== null)).length;

                const subjectStats = {};
                compareSubjects.forEach(sub => {
                    const vals = [];
                    examRecords.forEach(r => {
                        const v = getStudentSubjectScore(r, sub);
                        if (v !== null && !isNaN(v)) vals.push(v);
                    });
                    const st = calcArrayStats(vals);
                    if (st) {
                        // 上位基準（80点以上 / 偏差値60以上 / 5教科400点以上 / 9教科720点以上 / 3教科240点以上）
                        const highTh = sub.includes('偏差値') ? 60 : (sub === '5教科総点' ? 400 : (sub === '9教科総点' ? 720 : (sub === '3教科点数' ? 240 : 80)));
                        // 下位基準（50点未満 / 偏差値45未満 / 5教科250点未満 / 9教科450点未満 / 3教科150点未満）
                        const lowTh = sub.includes('偏差値') ? 45 : (sub === '5教科総点' ? 250 : (sub === '9教科総点' ? 450 : (sub === '3教科点数' ? 150 : 50)));
                        const highCount = vals.filter(v => v >= highTh).length;
                        const lowCount = vals.filter(v => v < lowTh).length;
                        subjectStats[sub] = {
                            ...st,
                            values: vals,
                            highTh,
                            lowTh,
                            highCount,
                            highRate: (highCount / st.count) * 100,
                            lowCount,
                            lowRate: (lowCount / st.count) * 100
                        };
                    }
                });

                return {
                    classFilter,
                    totalStudents: examRecords.length,
                    examineeCount,
                    subjectStats,
                    rawRecords: examRecords
                };
            };

            // 選択中の試験における各クラス＋学年全体の統計データ
            const singleExamClassData = useMemo(() => {
                if (!activeExam) return { classes: [], overall: null };
                const classes = detectedClasses.map((cls, idx) => ({
                    className: cls,
                    palette: getClassPalette(cls, idx),
                    data: computeClassStatsForExam(activeExam, cls)
                }));
                const overall = {
                    className: 'ALL',
                    palette: getClassPalette('ALL'),
                    data: computeClassStatsForExam(activeExam, 'ALL')
                };
                return { classes, overall };
            }, [activeExam, detectedClasses, records, compareSubjects]);

            // 分布・階層比較用のバンド定義（distSubjectに応じた階層）
            const distributionBands = useMemo(() => {
                const isDev = distSubject.includes('偏差値');
                if (isDev) {
                    return [
                        { label: '偏差値 70以上', min: 70, max: 999 },
                        { label: '偏差値 60〜69.9', min: 60, max: 70 },
                        { label: '偏差値 50〜59.9', min: 50, max: 60 },
                        { label: '偏差値 40〜49.9', min: 40, max: 50 },
                        { label: '偏差値 30〜39.9', min: 30, max: 40 },
                        { label: '偏差値 30未満', min: -999, max: 30 }
                    ];
                }
                if (distSubject === '5教科総点') {
                    return [
                        { label: '450〜500点', min: 450, max: 501 },
                        { label: '400〜449点', min: 400, max: 450 },
                        { label: '350〜399点', min: 350, max: 400 },
                        { label: '300〜349点', min: 300, max: 350 },
                        { label: '250〜299点', min: 250, max: 300 },
                        { label: '200〜249点', min: 200, max: 250 },
                        { label: '200点未満', min: -999, max: 200 }
                    ];
                }
                if (distSubject === '9教科総点') {
                    return [
                        { label: '800〜900点', min: 800, max: 901 },
                        { label: '720〜799点', min: 720, max: 800 },
                        { label: '630〜719点', min: 630, max: 720 },
                        { label: '540〜629点', min: 540, max: 630 },
                        { label: '450〜539点', min: 450, max: 540 },
                        { label: '360〜449点', min: 360, max: 450 },
                        { label: '360点未満', min: -999, max: 360 }
                    ];
                }
                if (distSubject === '3教科点数') {
                    return [
                        { label: '270〜300点', min: 270, max: 301 },
                        { label: '240〜269点', min: 240, max: 270 },
                        { label: '210〜239点', min: 210, max: 240 },
                        { label: '180〜209点', min: 180, max: 210 },
                        { label: '150〜179点', min: 150, max: 180 },
                        { label: '120〜149点', min: 120, max: 150 },
                        { label: '120点未満', min: -999, max: 120 }
                    ];
                }
                return [
                    { label: '90〜100点', min: 90, max: 101 },
                    { label: '80〜89点', min: 80, max: 90 },
                    { label: '70〜79点', min: 70, max: 80 },
                    { label: '60〜69点', min: 60, max: 70 },
                    { label: '50〜59点', min: 50, max: 60 },
                    { label: '40〜49点', min: 40, max: 50 },
                    { label: '30〜39点', min: 30, max: 40 },
                    { label: '30点未満', min: -999, max: 30 }
                ];
            }, [distSubject]);

            // 10点刻み／偏差値10刻みの累積しきい値リスト（分布タブ＆通年推移タブ用）
            const cumulativeThresholds = useMemo(() => {
                const targetSub = mode === 'single' ? distSubject : trendSubject;
                if (targetSub.includes('偏差値') || (examType === 'benesse' && mode === 'trend')) {
                    return [30, 40, 50, 60, 70, 80];
                }
                if (targetSub === '5教科総点') {
                    return [150, 200, 250, 300, 350, 400, 450];
                }
                if (targetSub === '9教科総点') {
                    return [360, 450, 540, 630, 720, 810];
                }
                if (targetSub === '3教科点数') {
                    return [90, 120, 150, 180, 210, 240, 270];
                }
                return [20, 30, 40, 50, 60, 70, 80, 90];
            }, [mode, distSubject, trendSubject, examType]);

            // 学年上位シェア（TOP 10 / TOP 20 / TOP 30）のクラス別内訳を計算
            const topShareBySubject = useMemo(() => {
                if (!activeExam) return [];
                const examRecords = records.filter(r => r.examId === activeExam.id);
                return compareSubjects.map(sub => {
                    const scored = [];
                    examRecords.forEach(r => {
                        const v = getStudentSubjectScore(r, sub);
                        if (v !== null && !isNaN(v)) {
                            scored.push({ studentId: r.studentId, class: String(r.class).trim(), val: v });
                        }
                    });
                    scored.sort((a, b) => b.val - a.val);
                    // 同点同順位の付与
                    let rank = 1;
                    const ranked = scored.map((item, idx) => {
                        if (idx > 0 && item.val !== scored[idx - 1].val) {
                            rank = idx + 1;
                        }
                        return { ...item, rank };
                    });

                    const calcShare = (topLimit) => {
                        const topItems = ranked.filter(item => item.rank <= topLimit);
                        const counts = {};
                        detectedClasses.forEach(c => { counts[c] = 0; });
                        topItems.forEach(item => {
                            counts[item.class] = (counts[item.class] || 0) + 1;
                        });
                        return { total: topItems.length, counts };
                    };

                    return {
                        subject: sub,
                        top10: calcShare(10),
                        top20: calcShare(20),
                        top30: calcShare(30)
                    };
                });
            }, [activeExam, records, compareSubjects, detectedClasses]);

            // モード②：通年推移のクラス別シリーズ計算
            const classTrendSeries = useMemo(() => {
                const targetGroups = [
                    ...detectedClasses.map((cls, idx) => ({ key: cls, palette: getClassPalette(cls, idx) })),
                    { key: 'ALL', palette: getClassPalette('ALL') }
                ];

                return targetGroups.map(group => {
                    const points = typeExams.map(exam => {
                        const allExamRecs = records.filter(r => r.examId === exam.id);
                        const groupRecs = group.key === 'ALL'
                            ? allExamRecs
                            : allExamRecs.filter(r => String(r.class).trim() === group.key);

                        const vals = [];
                        groupRecs.forEach(r => {
                            const v = getStudentSubjectScore(r, trendSubject);
                            if (v !== null && !isNaN(v)) vals.push(v);
                        });

                        if (vals.length === 0) {
                            return { examId: exam.id, examName: exam.name, val: null, subText: null };
                        }

                        const st = calcArrayStats(vals);
                        if (trendMetricType === 'average') {
                            return { examId: exam.id, examName: exam.name, val: st.avg, count: st.count };
                        }
                        if (trendMetricType === 'median') {
                            return { examId: exam.id, examName: exam.name, val: st.median, count: st.count };
                        }
                        if (trendMetricType === 'count_gte' || trendMetricType === 'rate_gte') {
                            const matched = vals.filter(v => v >= Number(trendThreshold)).length;
                            const rate = (matched / st.count) * 100;
                            return {
                                examId: exam.id,
                                examName: exam.name,
                                val: trendMetricType === 'count_gte' ? matched : rate,
                                matched,
                                rate,
                                count: st.count
                            };
                        }
                        if (trendMetricType === 'count_lt' || trendMetricType === 'rate_lt') {
                            const matched = vals.filter(v => v < Number(trendThreshold)).length;
                            const rate = (matched / st.count) * 100;
                            return {
                                examId: exam.id,
                                examName: exam.name,
                                val: trendMetricType === 'count_lt' ? matched : rate,
                                matched,
                                rate,
                                count: st.count
                            };
                        }
                        if (trendMetricType === 'top_n') {
                            // 学年全体の中でTOP Nに入っている該当クラスの生徒数を算出
                            const allScored = [];
                            allExamRecs.forEach(r => {
                                const v = getStudentSubjectScore(r, trendSubject);
                                if (v !== null && !isNaN(v)) {
                                    allScored.push({ class: String(r.class).trim(), val: v });
                                }
                            });
                            allScored.sort((a, b) => b.val - a.val);
                            let rk = 1;
                            const allRanked = allScored.map((it, idx) => {
                                if (idx > 0 && it.val !== allScored[idx - 1].val) rk = idx + 1;
                                return { ...it, rank: rk };
                            });
                            const topAll = allRanked.filter(it => it.rank <= Number(trendTopN));
                            const matched = group.key === 'ALL'
                                ? topAll.length
                                : topAll.filter(it => it.class === group.key).length;
                            const shareRate = topAll.length > 0 ? (matched / topAll.length) * 100 : 0;
                            return {
                                examId: exam.id,
                                examName: exam.name,
                                val: matched,
                                matched,
                                rate: shareRate,
                                count: topAll.length
                            };
                        }
                        return { examId: exam.id, examName: exam.name, val: st.avg, count: st.count };
                    });

                    return {
                        key: group.key,
                        palette: group.palette,
                        points
                    };
                });
            }, [detectedClasses, typeExams, records, trendSubject, trendMetricType, trendThreshold, trendTopN]);

            const typeTitle = examType === 'regular' ? '定期試験' : (examType === 'benesse' ? '学力推移調査' : '学期総合');
            const firstCls = singleExamClassData.classes[0];
            const secondCls = singleExamClassData.classes[1];

            // 概要タブの棒グラフ指標ラベル定義
            const overviewStatOptions = [
                { key: 'avg', label: '平均点（平均偏差値）', unit: '' },
                { key: 'median', label: '中央値（メジアン）', unit: '' },
                { key: 'max', label: '最高点', unit: '' },
                { key: 'min', label: '最低点', unit: '' },
                { key: 'stdDev', label: '標準偏差（ばらつき）', unit: '' },
                { key: 'highRate', label: examType === 'benesse' ? '偏差値60以上の割合(%)' : '80点以上の割合(%)', unit: '%' },
                { key: 'lowRate', label: examType === 'benesse' ? '偏差値45未満の割合(%)' : '50点未満の割合(%)', unit: '%' }
            ];

            return (
                <div className={isPrint ? 'w-full' : 'space-y-4'}>
                    {/* 印刷時のヘッダー */}
                    {isPrint && (
                        <div className="flex items-center justify-between border-b-2 border-slate-800 pb-2 mb-3">
                            <div>
                                <h2 className="text-lg font-extrabold text-slate-900">
                                    {currentCohort.name} クラス間比較レポート（{typeTitle} ／ {mode === 'single' ? `${activeExam ? activeExam.name : ''}` : `通年推移：${trendSubject}`}）
                                </h2>
                                <p className="text-[10.5px] text-slate-500">
                                    対象クラス: {detectedClasses.map(c => `${c}組`).join(' vs ')}
                                </p>
                            </div>
                        </div>
                    )}

                    {/* 操作パネル（画面表示時のみ） */}
                    {!isPrint && (
                        <div className="bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200 shadow-sm space-y-3.5">
                            <div className="flex flex-wrap items-center justify-between gap-2.5">
                                {/* 期生切替ボタン（3年周期カラー対応） */}
                                <div className="flex flex-wrap items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                    <span className="text-[11px] font-bold text-slate-500 px-1.5">対象期生:</span>
                                    {cohorts.map((c, idx) => {
                                        const pal = getCohortPalette(c, idx);
                                        const isAct = c.id === currentCohort.id;
                                        return (
                                            <button
                                                key={c.id}
                                                type="button"
                                                onClick={() => onSelectCohort(c.id)}
                                                className={`px-2.5 py-1 rounded-md text-xs font-extrabold transition-all flex items-center gap-1.5 ${
                                                    isAct ? `${pal.badge} text-white shadow` : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'
                                                }`}
                                            >
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: isAct ? '#fff' : pal.color }}></span>
                                                {c.name}
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* 試験種別タブ */}
                                <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                    {[
                                        { id: 'regular', label: '定期試験', activeCls: 'bg-blue-600 text-white shadow' },
                                        { id: 'benesse', label: '学力推移調査', activeCls: 'bg-green-600 text-white shadow' },
                                        { id: 'comprehensive', label: '学期総合', activeCls: 'bg-purple-600 text-white shadow' }
                                    ].map(t => (
                                        <button
                                            key={t.id}
                                            type="button"
                                            onClick={() => setClassCompareConfig(prev => ({ ...prev, examType: t.id, selectedExamId: '' }))}
                                            className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${examType === t.id ? t.activeCls : 'text-slate-600 hover:bg-white/60'}`}
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>

                                {/* 比較モード（試験別詳細 vs 通年推移） */}
                                <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                    <button
                                        type="button"
                                        onClick={() => setClassCompareConfig(prev => ({ ...prev, mode: 'single' }))}
                                        className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${mode === 'single' ? 'bg-slate-800 text-white shadow' : 'text-slate-600 hover:bg-white/60'}`}
                                    >
                                        📊 試験別でクラス間比較（多項目分析）
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setClassCompareConfig(prev => ({ ...prev, mode: 'trend' }))}
                                        className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${mode === 'trend' ? 'bg-slate-800 text-white shadow' : 'text-slate-600 hover:bg-white/60'}`}
                                    >
                                        📈 通年推移でクラス間比較（A組 vs B組の推移）
                                    </button>
                                </div>
                            </div>

                            {/* モード①：試験選択＆分析視点サブタブ */}
                            {mode === 'single' && (
                                <div className="space-y-3 pt-2 border-t border-slate-100">
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-xs font-bold text-slate-500 mr-1">対象試験を選択:</span>
                                        {typeExams.length === 0 ? (
                                            <span className="text-xs text-slate-400">この種別の試験データが登録されていません</span>
                                        ) : (
                                            typeExams.map(ex => (
                                                <button
                                                    key={ex.id}
                                                    type="button"
                                                    onClick={() => setClassCompareConfig(prev => ({ ...prev, selectedExamId: ex.id }))}
                                                    className={`px-3 py-1 rounded-full text-xs font-bold border transition-all ${
                                                        (activeExam && activeExam.id === ex.id)
                                                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                                                            : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-blue-50'
                                                    }`}
                                                >
                                                    {ex.name}
                                                </button>
                                            ))
                                        )}
                                    </div>

                                    {/* 3つの詳細分析サブタブ */}
                                    <div className="flex flex-wrap items-center gap-1.5 pt-1">
                                        <span className="text-xs font-bold text-slate-500 mr-1">比較する項目・視点:</span>
                                        {[
                                            { id: 'overview', label: '① 全科目の基本統計（平均・中央値・最高・最低・標準偏差・上位/下位率）' },
                                            { id: 'distribution', label: '② 点数・偏差値 階層分布 ＆ 10点/10刻み人数・割合比較' },
                                            { id: 'top_share', label: '③ 学年上位層（TOP10 / TOP20 / TOP30）のクラス別シェア比較' }
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                type="button"
                                                onClick={() => setClassCompareConfig(prev => ({ ...prev, singleSubTab: tab.id }))}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-extrabold border transition-all ${
                                                    singleSubTab === tab.id
                                                        ? 'bg-rose-600 text-white border-rose-600 shadow-sm'
                                                        : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                                                }`}
                                            >
                                                {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* モード②：通年推移の指標選択＆科目・基準値セレクター */}
                            {mode === 'trend' && (
                                <div className="space-y-3 pt-2 border-t border-slate-100">
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-xs font-bold text-slate-500 mr-1">推移を比較する項目:</span>
                                        {[
                                            { id: 'average', label: '📈 平均点の推移', cls: 'bg-blue-600 text-white' },
                                            { id: 'median', label: '📐 中央値（メジアン）の推移', cls: 'bg-indigo-600 text-white' },
                                            { id: 'count_gte', label: examType === 'benesse' ? '⬆️ 指定偏差値「以上」の人数' : '⬆️ 指定点数「以上」の人数', cls: 'bg-emerald-600 text-white' },
                                            { id: 'rate_gte', label: examType === 'benesse' ? '📊 指定偏差値「以上」の割合(%)' : '📊 指定点数「以上」の割合(%)', cls: 'bg-teal-600 text-white' },
                                            { id: 'count_lt', label: examType === 'benesse' ? '⬇️ 指定偏差値「未満」の人数' : '⬇️ 指定点数「未満」の人数', cls: 'bg-rose-600 text-white' },
                                            { id: 'top_n', label: '🏆 学年上位（TOP N）のクラス別人数', cls: 'bg-amber-600 text-white' }
                                        ].map(m => (
                                            <button
                                                key={m.id}
                                                type="button"
                                                onClick={() => {
                                                    let defaultTh = trendThreshold;
                                                    if (m.id.includes('gte')) {
                                                        defaultTh = trendSubject.includes('偏差値') ? 60 : (trendSubject === '5教科総点' ? 400 : (trendSubject === '9教科総点' ? 720 : 80));
                                                    } else if (m.id.includes('lt')) {
                                                        defaultTh = trendSubject.includes('偏差値') ? 40 : (trendSubject === '5教科総点' ? 250 : (trendSubject === '9教科総点' ? 450 : 50));
                                                    }
                                                    setClassCompareConfig(prev => ({ ...prev, trendMetricType: m.id, trendThreshold: defaultTh }));
                                                }}
                                                className={`px-2.5 py-1 rounded-md text-xs font-bold border transition-all ${
                                                    trendMetricType === m.id ? `${m.cls} border-transparent shadow-sm` : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                                                }`}
                                            >
                                                {m.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 対象科目の選択 */}
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-xs font-bold text-slate-500 mr-1">対象科目:</span>
                                        {compareSubjects.map(sub => (
                                            <button
                                                key={sub}
                                                type="button"
                                                onClick={() => {
                                                    let nextTh = trendThreshold;
                                                    if (sub.includes('偏差値')) nextTh = trendMetricType.includes('lt') ? 40 : 60;
                                                    else if (sub === '5教科総点') nextTh = trendMetricType.includes('lt') ? 250 : 400;
                                                    else if (sub === '9教科総点') nextTh = trendMetricType.includes('lt') ? 450 : 720;
                                                    else if (sub === '3教科点数') nextTh = trendMetricType.includes('lt') ? 150 : 240;
                                                    else nextTh = trendMetricType.includes('lt') ? 50 : 80;
                                                    setClassCompareConfig(prev => ({ ...prev, trendSubject: sub, trendThreshold: nextTh }));
                                                }}
                                                className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-all ${
                                                    trendSubject === sub
                                                        ? 'bg-slate-800 text-white border-slate-800 shadow-sm'
                                                        : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                }`}
                                            >
                                                {sub}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 基準値（10点刻み/偏差値10刻み）または TOP N の選択 */}
                                    {(trendMetricType === 'count_gte' || trendMetricType === 'rate_gte' || trendMetricType === 'count_lt') && (
                                        <div className="flex flex-wrap items-center gap-1.5 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                            <span className="text-xs font-bold text-slate-700 mr-1">基準値を選択:</span>
                                            {cumulativeThresholds.map(val => (
                                                <button
                                                    key={val}
                                                    type="button"
                                                    onClick={() => setClassCompareConfig(prev => ({ ...prev, trendThreshold: val }))}
                                                    className={`px-2.5 py-1 rounded text-xs font-extrabold border transition-all ${
                                                        Number(trendThreshold) === val
                                                            ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                                                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {trendSubject.includes('偏差値') ? `偏差値 ${val}` : `${val}点`}
                                                    {trendMetricType.includes('lt') ? ' 未満' : ' 以上'}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {trendMetricType === 'top_n' && (
                                        <div className="flex flex-wrap items-center gap-2 bg-amber-50/70 p-2.5 rounded-lg border border-amber-200">
                                            <span className="text-xs font-bold text-amber-900">学年上位の範囲を選択:</span>
                                            {[10, 20, 30, 50].map(n => (
                                                <button
                                                    key={n}
                                                    type="button"
                                                    onClick={() => setClassCompareConfig(prev => ({ ...prev, trendTopN: n }))}
                                                    className={`px-3 py-1 rounded text-xs font-extrabold border transition-all ${
                                                        Number(trendTopN) === n
                                                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                                                            : 'bg-white text-amber-900 border-amber-300 hover:bg-amber-100'
                                                    }`}
                                                >
                                                    学年 TOP {n} 以内
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* モード①：試験別のクラス間詳細比較 */}
                    {/* ========================================================= */}
                    {mode === 'single' && activeExam && (
                        <div className="space-y-4">
                            {/* サブタブ①：全科目の基本統計 ＆ グループ棒グラフ */}
                            {singleSubTab === 'overview' && (
                                <>
                                    {/* 1. 教科別 クラス間比較棒グラフ（指標切替対応） */}
                                    {chartSubjects.length > 0 && (() => {
                                        const currentOpt = overviewStatOptions.find(o => o.key === overviewStatKey) || overviewStatOptions[0];
                                        const isDev = examType === 'benesse' && (overviewStatKey === 'avg' || overviewStatKey === 'median' || overviewStatKey === 'max' || overviewStatKey === 'min');
                                        const isStd = overviewStatKey === 'stdDev';
                                        const minY = isDev ? 30 : 0;
                                        const maxY = isDev ? 85 : (isStd ? 30 : 100);
                                        const ticks = isDev ? [30, 40, 50, 60, 70, 80] : (isStd ? [0, 5, 10, 15, 20, 25, 30] : [0, 20, 40, 60, 80, 100]);

                                        const groupsToPlot = [...singleExamClassData.classes, singleExamClassData.overall].filter(g => g && g.data && g.data.totalStudents > 0);
                                        const svgW = 780;
                                        const svgH = isPrint ? 245 : 275;
                                        const padL = 44;
                                        const padR = 24;
                                        const padT = 28;
                                        const padB = 42;
                                        const plotW = svgW - padL - padR;
                                        const plotH = svgH - padT - padB;
                                        const subCount = chartSubjects.length;
                                        const groupW = plotW / subCount;
                                        const barCount = Math.max(1, groupsToPlot.length);
                                        const barW = Math.min(26, Math.max(10, (groupW * 0.74) / barCount));

                                        const getY = (v) => {
                                            const clamped = Math.max(minY, Math.min(maxY, v));
                                            return padT + plotH - ((clamped - minY) / (maxY - minY || 1)) * plotH;
                                        };

                                        return (
                                            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 sm:p-4">
                                                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                                    <div className="flex flex-wrap items-center gap-2">
                                                        <h4 className="text-xs sm:text-sm font-extrabold text-slate-800">
                                                            📊 【{activeExam.name}】クラス間 教科別比較グラフ
                                                        </h4>
                                                        {!isPrint && (
                                                            <div className="flex flex-wrap items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                                                {overviewStatOptions.map(opt => (
                                                                    <button
                                                                        key={opt.key}
                                                                        type="button"
                                                                        onClick={() => setClassCompareConfig(prev => ({ ...prev, overviewStatKey: opt.key }))}
                                                                        className={`px-2 py-0.5 rounded text-[11px] font-bold transition-colors ${
                                                                            overviewStatKey === opt.key ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-600 hover:bg-white'
                                                                        }`}
                                                                    >
                                                                        {opt.label}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex flex-wrap items-center gap-3">
                                                        {groupsToPlot.map(g => (
                                                            <span key={g.className} className="inline-flex items-center gap-1.5 text-xs font-extrabold text-slate-700">
                                                                <span className="w-3 h-3 rounded-sm" style={{ backgroundColor: g.palette.color }}></span>
                                                                {g.palette.label}（{g.data.examineeCount}名）
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="overflow-x-auto">
                                                    <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto min-w-[500px] select-none">
                                                        {ticks.map(t => {
                                                            const y = getY(t);
                                                            return (
                                                                <g key={t}>
                                                                    <line x1={padL} y1={y} x2={svgW - padR} y2={y} stroke="#e2e8f0" strokeWidth="1" />
                                                                    <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#64748b">
                                                                        {t}{currentOpt.unit}
                                                                    </text>
                                                                </g>
                                                            );
                                                        })}
                                                        {chartSubjects.map((sub, sIdx) => {
                                                            const centerX = padL + sIdx * groupW + groupW / 2;
                                                            const totalBarsW = barCount * barW + (barCount - 1) * 3;
                                                            const startX = centerX - totalBarsW / 2;
                                                            return (
                                                                <g key={sub}>
                                                                    {groupsToPlot.map((g, bIdx) => {
                                                                        const st = g.data.subjectStats[sub];
                                                                        const val = st ? st[overviewStatKey] : null;
                                                                        if (val === null || val === undefined) return null;
                                                                        const x = startX + bIdx * (barW + 3);
                                                                        const y = getY(val);
                                                                        const h = Math.max(2, padT + plotH - y);
                                                                        return (
                                                                            <g key={g.className}>
                                                                                <rect
                                                                                    x={x}
                                                                                    y={y}
                                                                                    width={barW}
                                                                                    height={h}
                                                                                    rx="3"
                                                                                    fill={g.palette.color}
                                                                                    opacity={g.palette.isAll ? '0.65' : '0.92'}
                                                                                />
                                                                                <text
                                                                                    x={x + barW / 2}
                                                                                    y={y - 5}
                                                                                    textAnchor="middle"
                                                                                    fontSize="9.5"
                                                                                    fontWeight="bold"
                                                                                    fill={g.palette.color}
                                                                                >
                                                                                    {Number(val).toFixed(1)}
                                                                                </text>
                                                                            </g>
