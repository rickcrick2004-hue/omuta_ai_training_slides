                        if (Array.isArray(parsed) && parsed.length > 0) {
                            loadedCohorts = parsed;
                        }
                    }
                    setCohorts(loadedCohorts);

                    const savedSelectedCohort = localStorage.getItem('blend_selected_cohort_id');
                    if (savedSelectedCohort && loadedCohorts.some(c => c.id === savedSelectedCohort)) {
                        setSelectedCohortId(savedSelectedCohort);
                    } else {
                        setSelectedCohortId(loadedCohorts[0].id);
                    }
                } catch(e) { console.error("Error parsing cohorts from local storage", e); }

                const fallbackCohortId = loadedCohorts[0].id;

                try {
                    const savedExams = localStorage.getItem('blend_exams');
                    if (savedExams) {
                        const parsedExams = JSON.parse(savedExams).map(e => ({
                            ...e,
                            type: e.type || 'regular',
                            cohortId: e.cohortId || fallbackCohortId
                        }));
                        setExams(parsedExams);
                    }
                } catch(e) { console.error("Error parsing exams from local storage", e); }

                try {
                    const savedRecords = localStorage.getItem('blend_records');
                    if (savedRecords) {
                        const parsedRecords = JSON.parse(savedRecords);
                        setRecords(migrateRecords(parsedRecords));
                    }
                } catch(e) { console.error("Error parsing records from local storage", e); }

                try {
                    const savedFbConfig = localStorage.getItem('blend_firebase_config');
                    const savedFbEnabled = localStorage.getItem('blend_firebase_enabled');
                    const savedSyncId = localStorage.getItem('blend_sync_id');
                    if (savedFbConfig) setFirebaseConfig(savedFbConfig);
                    if (savedFbEnabled !== null) setIsFirebaseEnabled(savedFbEnabled === 'true');
                    if (savedSyncId) setSyncId(savedSyncId);
                } catch(e) { console.error("Error parsing settings from local storage", e); }
            }, []);

            // Save basic data to localStorage when changed
            useEffect(() => {
                localStorage.setItem('blend_cohorts', JSON.stringify(cohorts));
                localStorage.setItem('blend_selected_cohort_id', selectedCohortId || '');
                localStorage.setItem('blend_exams', JSON.stringify(exams));
                localStorage.setItem('blend_records', JSON.stringify(records));
            }, [cohorts, selectedCohortId, exams, records]);

            // Save settings to localStorage when changed
            useEffect(() => {
                localStorage.setItem('blend_firebase_config', firebaseConfig);
                localStorage.setItem('blend_firebase_enabled', isFirebaseEnabled ? 'true' : 'false');
                localStorage.setItem('blend_sync_id', syncId);
            }, [firebaseConfig, isFirebaseEnabled, syncId]);

            // 非表示になっていない（表示設定がONの）期生リスト
            const visibleCohorts = useMemo(() => {
                const visible = cohorts.filter(c => !c.isHidden);
                return visible.length > 0 ? visible : [cohorts[0] || { id: 'cohort_default', name: '29期生' }];
            }, [cohorts]);

            // 現在選択中の期生のオブジェクト（非表示にされた場合は表示中の先頭期生にフォールバック）
            const currentCohort = useMemo(() => {
                return visibleCohorts.find(c => c.id === selectedCohortId) || visibleCohorts[0] || cohorts[0] || { id: 'cohort_default', name: '29期生' };
            }, [visibleCohorts, cohorts, selectedCohortId]);

            // 現在選択中の期生に属する試験一覧
            const currentCohortExams = useMemo(() => {
                const defaultId = cohorts[0] ? cohorts[0].id : 'cohort_default';
                return exams.filter(e => (e.cohortId || defaultId) === currentCohort.id);
            }, [exams, currentCohort, cohorts]);

            // Filter exams based on active tab and current cohort
            const currentExams = useMemo(() => {
                return currentCohortExams.filter(e => (e.type || 'regular') === activeTab);
            }, [currentCohortExams, activeTab]);

            // Set initial selected exam when tab changes or exam list updates
            useEffect(() => {
                if (currentExams.length > 0) {
                    let found = false;
                    for (let i = 0; i < currentExams.length; i++) {
                        if (currentExams[i].id === selectedExamId) {
                            found = true;
                            break;
                        }
                    }
                    if (!selectedExamId || !found) {
                        setSelectedExamId(currentExams[currentExams.length - 1].id);
                    }
                } else {
                    setSelectedExamId(null);
                }
            }, [currentExams, selectedExamId]);

            // --- Cohort Management Handlers ---
            const handleAddCohort = (e) => {
                if (e) e.preventDefault();
                const trimmed = newCohortNameInput.trim();
                if (!trimmed) return;
                const newId = 'cohort_' + generateId();
                const newCohort = { id: newId, name: trimmed, order: cohorts.length };
                setCohorts([...cohorts, newCohort]);
                setSelectedCohortId(newId);
                setSelectedStudentId(null);
                setNewCohortNameInput('');
            };

            const handleSaveCohortName = (id) => {
                const trimmed = editingCohortName.trim();
                if (!trimmed) return;
                setCohorts(cohorts.map(c => c.id === id ? { ...c, name: trimmed } : c));
                setEditingCohortId(null);
                setEditingCohortName('');
            };

            const handleMoveCohort = (index, direction) => {
                const targetIndex = direction === 'up' ? index - 1 : index + 1;
                if (targetIndex < 0 || targetIndex >= cohorts.length) return;
                const updated = [...cohorts];
                const temp = updated[index];
                updated[index] = updated[targetIndex];
                updated[targetIndex] = temp;
                setCohorts(updated.map((c, i) => ({ ...c, order: i })));
            };

            const handleToggleHideCohort = (id) => {
                const target = cohorts.find(c => c.id === id);
                if (!target) return;
                const nextHidden = !target.isHidden;
                if (nextHidden) {
                    const remainingVisible = cohorts.filter(c => c.id !== id && !c.isHidden);
                    if (remainingVisible.length === 0) {
                        return; // 最低1つの期生は表示状態を維持する
                    }
                    if (selectedCohortId === id) {
                        setSelectedCohortId(remainingVisible[0].id);
                        setSelectedStudentId(null);
                    }
                }
                setCohorts(cohorts.map(c => c.id === id ? { ...c, isHidden: nextHidden } : c));
            };

            const handleDeleteCohort = (id) => {
                if (cohorts.length <= 1) return;
                const defaultId = cohorts[0].id;
                const examIdsToRemove = new Set(
                    exams.filter(e => (e.cohortId || defaultId) === id).map(e => e.id)
                );
                const remainingCohorts = cohorts.filter(c => c.id !== id).map((c, i) => ({ ...c, order: i }));
                const remainingExams = exams.filter(e => !examIdsToRemove.has(e.id));
                const remainingRecords = records.filter(r => !examIdsToRemove.has(r.examId));

                setCohorts(remainingCohorts);
                setExams(remainingExams);
                setRecords(remainingRecords);
                setConfirmDeleteCohortId(null);
                if (selectedCohortId === id) {
                    setSelectedCohortId(remainingCohorts[0].id);
                    setSelectedStudentId(null);
                }
            };

            // --- Handlers ---
            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!importExamName.trim()) {
                    alert('試験名を入力してください（例：1年1学期中間、第1回学力推移調査、1学期総合）');
                    if (fileInputRef && fileInputRef.current) {
                        fileInputRef.current.value = '';
                    }
                    return;
                }

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const data = results.data;
                        processCSVData(data, importExamName);
                        if (fileInputRef && fileInputRef.current) {
                            fileInputRef.current.value = '';
                        }
                        setImportExamName('');
                    }
                });
            };

            const handleUpdateCSV = (e) => {
                if (!selectedExamId) return;
                const file = e.target.files[0];
                if (!file) return;
                if (!window.confirm('現在表示中の試験データをこのCSVファイルで上書き更新しますか？')) {
                    e.target.value = '';
                    return;
                }

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const data = results.data;
                        processUpdateCSVData(data, selectedExamId);
                        e.target.value = '';
                    }
                });
            };

            const handleDownloadSampleCSV = (type) => {
                let csvContent = "";
                let filename = "";
                if (type === 'regular' || type === 'comprehensive') {
                    csvContent = "学年,組,出席番号,氏名,学園奨学生,国語,社会,数学,理科,英語,5教科総点,5教科平均点,5教科学級席次,5教科学年席次,音楽,美術,保体,技家,9教科総点,9教科平均点,9教科学級席次,9教科学年席次\n";
                    filename = `format_${type}.csv`;
                } else if (type === 'benesse') {
                    csvContent = "学年,組,出席番号,氏名,学園奨学生,国語点数,国語偏差値,国語学年順位,数学点数,数学偏差値,数学学年順位,英語点数,英語偏差値,英語学年順位,3教科点数,3教科偏差値,3教科学年順位\n";
                    filename = "format_benesse.csv";
                }
                
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const processCSVData = (data, examName) => {
                let examType = 'regular';
                if (data.length > 0 && Object.keys(data[0]).some(k => k.includes('偏差値') || k.includes('模試') || k.includes('推移調査'))) {
                    examType = 'benesse';
                }
                if (examName && (examName.includes('総合') || examName.includes('学期総合'))) {
                    examType = 'comprehensive';
                }

                const newExamId = generateId();
                const newExam = {
                    id: newExamId,
                    name: examName,
                    order: exams.length,
                    type: examType,
                    cohortId: currentCohort.id
                };
                
                const newRecords = [];

                data.forEach(row => {
                    const grade = row['学年'] || '';
                    const cls = row['組'] || row['クラス'] || '';
                    const no = row['出席番号'] || row['番号'] || '';
                    const rawName = row['氏名'] || row['名前'] || '';
                    
                    let scholarship = '';
                    
                    if (!rawName) return; 
                    
                    const studentId = normalizeName(rawName);
                    const scores = {};

                    Object.keys(row).forEach(key => {
                        if (key.includes('奨学生') || key.includes('奨学')) {
                            const val = (row[key] || '').trim();
                            if (val.includes('A') || val === '奨A') scholarship = '奨A';
                            else if (val.includes('B') || val === '奨B') scholarship = '奨B';
                            else if (val.includes('C') || val === '奨C') scholarship = '奨C';
                            else scholarship = val;
                            return;
                        }

                        if (['学年', '組', 'クラス', '出席番号', '番号', '氏名', '名前'].includes(key)) {
                            return;
                        }
                        
                        const val = row[key];
                        const subjectName = key.replace('評点', '').replace('全国', '').trim();
                        const scoreNum = Number(val);
                        
                        if (!isNaN(scoreNum) && val.trim() !== '') {
                            scores[subjectName] = scoreNum;
                        }
                    });

                    newRecords.push({
                        examId: newExamId,
                        studentId,
                        rawName,
                        grade,
                        class: cls,
                        no: parseInt(no) || 0,
                        scholarship,
                        scores
                    });
                });

                setExams([...exams, newExam]);
                setRecords([...records, ...newRecords]);
                setActiveTab(examType);
                setSelectedExamId(newExamId);
            };

            const processUpdateCSVData = (data, examIdToUpdate) => {
                let examToUpdate = null;
                for(let i=0; i<exams.length; i++){
                    if(exams[i].id === examIdToUpdate){
                        examToUpdate = exams[i];
                        break;
                    }
                }
                if (!examToUpdate) return;

                let examType = examToUpdate.type || 'regular';
                if (data.length > 0 && Object.keys(data[0]).some(k => k.includes('偏差値') || k.includes('模試') || k.includes('推移調査'))) {
                    examType = 'benesse';
                }
                if (examToUpdate.name && (examToUpdate.name.includes('総合') || examToUpdate.name.includes('学期総合'))) {
                    examType = 'comprehensive';
                }

                const newExams = exams.map(e => e.id === examIdToUpdate ? { ...e, type: examType } : e);
                const newRecordsForExam = [];

                data.forEach(row => {
                    const grade = row['学年'] || '';
                    const cls = row['組'] || row['クラス'] || '';
                    const no = row['出席番号'] || row['番号'] || '';
                    const rawName = row['氏名'] || row['名前'] || '';
                    
                    let scholarship = '';
                    
                    if (!rawName) return; 
                    
                    const studentId = normalizeName(rawName);
                    const scores = {};

                    Object.keys(row).forEach(key => {
                        if (key.includes('奨学生') || key.includes('奨学')) {
                            const val = (row[key] || '').trim();
                            if (val.includes('A') || val === '奨A') scholarship = '奨A';
                            else if (val.includes('B') || val === '奨B') scholarship = '奨B';
                            else if (val.includes('C') || val === '奨C') scholarship = '奨C';
                            else scholarship = val;
                            return;
                        }

                        if (['学年', '組', 'クラス', '出席番号', '番号', '氏名', '名前'].includes(key)) {
                            return;
                        }
                        
                        const val = row[key];
                        const subjectName = key.replace('評点', '').replace('全国', '').trim();
                        const scoreNum = Number(val);
                        
                        if (!isNaN(scoreNum) && val.trim() !== '') {
                            scores[subjectName] = scoreNum;
                        }
                    });

                    newRecordsForExam.push({
                        examId: examIdToUpdate,
                        studentId,
                        rawName,
                        grade,
                        class: cls,
                        no: parseInt(no) || 0,
                        scholarship,
                        scores
                    });
                });

                const filteredRecords = records.filter(r => r.examId !== examIdToUpdate);
                setExams(newExams);
                setRecords([...filteredRecords, ...newRecordsForExam]);
                
                if (activeTab !== examType) {
                    setActiveTab(examType);
                }
                alert('表示中の試験データを更新しました。');
            };

            const handleClearData = () => {
                if (window.confirm('すべての成績データを削除します。よろしいですか？')) {
                    setExams([]);
                    setRecords([]);
                    setSelectedExamId(null);
                    setSelectedStudentId(null);
                }
            };

            const handleDeleteExam = (id) => {
                if (window.confirm('この試験のデータを削除しますか？')) {
                    const newExams = exams.filter(e => e.id !== id);
                    const reorderedExams = newExams.map((e, idx) => ({ ...e, order: idx }));
                    setExams(reorderedExams);
                    setRecords(records.filter(r => r.examId !== id));
                    if (selectedExamId === id) {
                        const remaining = reorderedExams.filter(e => (e.type || 'regular') === activeTab);
                        setSelectedExamId(remaining.length > 0 ? remaining[remaining.length - 1].id : null);
                    }
                }
            };

            const handleSort = (key) => {
                if (key.startsWith('score_')) {
                    if (sortConfig.key === key) {
                        if (sortConfig.direction === 'desc') setSortConfig({ key, direction: 'asc' });
                        else if (sortConfig.direction === 'asc') setSortConfig({ key, direction: 'diff_desc' });
                        else if (sortConfig.direction === 'diff_desc') setSortConfig({ key, direction: 'diff_asc' });
                        else setSortConfig({ key, direction: 'desc' });
                    } else {
                        setSortConfig({ key, direction: 'desc' }); // 初期は大きい順
                    }
                } else {
                    let direction = 'asc';
                    if (sortConfig.key === key && sortConfig.direction === 'asc') {
                        direction = 'desc';
                    }
                    setSortConfig({ key, direction });
                }
            };

            // --- Sync Handlers (Firebase & JSON) ---

            const getFirebaseDb = () => {
                if (!firebaseConfig.trim()) throw new Error('Firebase設定が入力されていません。');
                let configObj;
                try {
                    let str = firebaseConfig.trim();
                    if (str.includes('const firebaseConfig') || str.includes('=')) {
                        str = str.substring(str.indexOf('{'), str.lastIndexOf('}') + 1);
                    }
                    configObj = new Function("return " + str)();
                } catch (e) {
                    throw new Error('設定の形式が不正です。 { から } までのすべての内容が含まれているか確認してください。');
                }

                if (!configObj || !configObj.apiKey || !configObj.projectId) {
                    throw new Error('設定に必要な情報 (apiKey や projectId) が不足しています。全体をコピーできているか確認してください。');
                }

                if (!firebase.apps.length) {
                    firebase.initializeApp(configObj);
                } else {
                    const currentConfig = firebase.app().options;
                    if (currentConfig.projectId !== configObj.projectId) {
                        throw new Error('設定が変更されました。ページをリロードして再試行してください。');
                    }
                }
                return firebase.firestore();
            };

            const handleCloudSave = async () => {
                if (!syncId.trim()) return alert('Sync IDを入力してください。');
                try {
                    const db = getFirebaseDb();
                    await db.collection('blend_sync_data').doc(syncId).set({
                        cohorts,
                        exams,
                        records,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert(`Sync ID: [${syncId}] に全期生のデータを保存(上書き)しました。`);
                } catch (error) {
                    console.error(error);
                    alert('保存に失敗しました。\n\n詳細: ' + error.message);
                }
            };

            const handleCloudLoad = async () => {
                if (!syncId.trim()) return alert('Sync IDを入力してください。');
                if (!window.confirm('現在のデータはクラウド上のデータで上書きされます。よろしいですか？')) return;
                try {
                    const db = getFirebaseDb();
                    const doc = await db.collection('blend_sync_data').doc(syncId).get();
                    if (doc.exists) {
                        const data = doc.data();
                        const loadedCohorts = (Array.isArray(data.cohorts) && data.cohorts.length > 0)
                            ? data.cohorts
                            : [{ id: 'cohort_default', name: '29期生', order: 0 }];
                        const fallbackId = loadedCohorts[0].id;
                        setCohorts(loadedCohorts);
                        setSelectedCohortId(fallbackId);
                        setExams((data.exams || []).map(ex => ({
                            ...ex,
                            type: ex.type || 'regular',
                            cohortId: ex.cohortId || fallbackId
                        })));
                        setRecords(migrateRecords(data.records || []));
                        alert('クラウドからデータを取得しました。');
                    } else {
                        alert('指定されたSync IDのデータが見つかりません。');
                    }
                } catch (error) {
                    console.error(error);
                    alert('取得に失敗しました。\n\n詳細: ' + error.message);
                }
            };

            const handleJsonExport = () => {
                const data = { cohorts, exams, records };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `blend_data_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleJsonImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!window.confirm('現在のデータは読み込んだデータで上書きされます。よろしいですか？')) {
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.exams !== undefined && data.records !== undefined) {
                            const loadedCohorts = (Array.isArray(data.cohorts) && data.cohorts.length > 0)
                                ? data.cohorts
                                : [{ id: 'cohort_default', name: '29期生', order: 0 }];
                            const fallbackId = loadedCohorts[0].id;
                            setCohorts(loadedCohorts);
                            setSelectedCohortId(fallbackId);
                            setExams(data.exams.map(ex => ({
                                ...ex,
                                type: ex.type || 'regular',
                                cohortId: ex.cohortId || fallbackId
                            })));
                            setRecords(migrateRecords(data.records));
                            alert('JSONファイルからデータを復元しました。');
                        } else {
                            alert('未対応のJSONフォーマットです。');
                        }
                    } catch (error) {
                        alert('JSONファイルの読み込みに失敗しました。');
                    }
                    e.target.value = ''; 
                };
                reader.readAsText(file);
            };

            // --- Data Processing for View ---
            
            const currentSubjects = useMemo(() => {
                if (!selectedExamId) return [];
                const examRecords = records.filter(r => r.examId === selectedExamId);
                const subjects = new Set();
                examRecords.forEach(r => {
                    Object.keys(r.scores).forEach(s => subjects.add(s));
                });
                
                const subArray = Array.from(subjects);
                
                subArray.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });

                return subArray;
            }, [records, selectedExamId]);

            const previousExamId = useMemo(() => {
                if (!selectedExamId || currentExams.length <= 1) return null;
                const idx = currentExams.findIndex(e => e.id === selectedExamId);
                if (idx <= 0) return null;
                return currentExams[idx - 1].id;
            }, [currentExams, selectedExamId]);

            const tableData = useMemo(() => {
                if (!selectedExamId) return [];
                
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                let prevRecords = [];
                if (previousExamId) {
                    prevRecords = records.filter(r => r.examId === previousExamId);
                }

                const combined = currentRecords.map(curr => {
                    let prev = null;
                    for (let i = 0; i < prevRecords.length; i++) {
                        if (prevRecords[i].studentId === curr.studentId) {
                            prev = prevRecords[i];
                            break;
                        }
                    }
                    const diffs = {};
                    
                    currentSubjects.forEach(sub => {
                        const currentScore = curr.scores[sub];
                        if (prev && prev.scores[sub] !== undefined && currentScore !== undefined) {
                            diffs[sub] = currentScore - prev.scores[sub];
                        }
                    });

                    return {
                        ...curr,
                        prevScores: prev ? prev.scores : null,
                        diffs
                    };
                });

                return combined.sort((a, b) => {
                    let valA, valB;
                    
                    if (sortConfig.key === 'class_no') {
                        valA = `${a.grade}-${a.class}-${a.no.toString().padStart(3, '0')}`;
                        valB = `${b.grade}-${b.class}-${b.no.toString().padStart(3, '0')}`;
                    } else if (sortConfig.key === 'name') {
                        valA = a.studentId;
                        valB = b.studentId;
                    } else if (sortConfig.key === 'scholarship') {
                        const getRank = (val) => {
                            if (!val) return 99; 
                            if (val.includes('A') || val === '奨A') return 1;
                            if (val.includes('B') || val === '奨B') return 2;
                            if (val.includes('C') || val === '奨C') return 3;
                            return 4; 
                        };
                        valA = getRank(a.scholarship);
                        valB = getRank(b.scholarship);
                    } else if (sortConfig.key.startsWith('score_')) {
                        const subject = sortConfig.key.replace('score_', '');
                        if (sortConfig.direction === 'diff_desc' || sortConfig.direction === 'diff_asc') {
                            const diffA = a.diffs[subject];
                            const diffB = b.diffs[subject];
                            if (diffA === undefined && diffB !== undefined) return 1;
                            if (diffA !== undefined && diffB === undefined) return -1;
                            if (diffA === undefined && diffB === undefined) return 0;
                            valA = diffA;
                            valB = diffB;
                        } else {
                            valA = a.scores[subject] !== undefined && a.scores[subject] !== null ? a.scores[subject] : -9999;
                            valB = b.scores[subject] !== undefined && b.scores[subject] !== null ? b.scores[subject] : -9999;
                        }
                    }

                    if (valA < valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? -1 : 1;
                    if (valA > valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? 1 : -1;
                    return 0;
                });
            }, [records, selectedExamId, previousExamId, currentSubjects, sortConfig]);

            // 利用可能なクラスのリスト（印刷設定用）
            const availableClasses = useMemo(() => {
                const classes = new Set();
                tableData.forEach(r => {
                    if (r.class) classes.add(r.class);
                });
                return Array.from(classes).sort();
            }, [tableData]);

            const examineeCount = useMemo(() => {
                if (!selectedExamId) return 0;
                let foundExam = null;
                for (let i = 0; i < exams.length; i++) {
                    if (exams[i].id === selectedExamId) {
                        foundExam = exams[i];
                        break;
                    }
                }
                const isBenesse = foundExam && foundExam.type === 'benesse';
                const coreSubjects = isBenesse ? ['国語点数', '数学点数', '英語点数'] : ['国語', '社会', '数学', '理科', '英語'];
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                return currentRecords.filter(r => {
                    return coreSubjects.every(sub => r.scores[sub] !== undefined && r.scores[sub] !== null);
                }).length;
            }, [records, selectedExamId, exams]);

            const averages = useMemo(() => {
                if (!selectedExamId) return {};
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                
                const sums = {};
                const counts = {};
                
                currentSubjects.forEach(sub => {
                    sums[sub] = 0;
                    counts[sub] = 0;
                });

                currentRecords.forEach(r => {
                    currentSubjects.forEach(sub => {
                        const score = r.scores[sub];
                        if (score !== undefined && score !== null && !isNaN(score)) {
                            sums[sub] += Number(score);
                            counts[sub] += 1;
                        }
                    });
                });

                const avgs = {};
                currentSubjects.forEach(sub => {
                    if (counts[sub] > 0) {
                        avgs[sub] = sums[sub] / counts[sub];
                    } else {
                        avgs[sub] = null;
                    }
                });
                return avgs;
            }, [records, selectedExamId, currentSubjects]);

            // --- 個人表（統計サマリー）のデータ生成ロジック ---
            const getComprehensiveStudentReport = (studentId) => {
                const reportSections = [];
                const tabTypes = ['regular', 'benesse', 'comprehensive'];

                tabTypes.forEach(type => {
                    const typeExams = currentCohortExams.filter(e => (e.type || 'regular') === type);
                    if (typeExams.length === 0) return;

                    const typeRecords = records.filter(r => typeExams.some(e => e.id === r.examId));
                    const subjectsSet = new Set();
                    typeRecords.filter(r => r.studentId === studentId).forEach(r => {
                        Object.keys(r.scores).forEach(s => subjectsSet.add(s));
                    });
                    
                    const subjectsArray = Array.from(subjectsSet).sort((a, b) => {
                        const idxA = SUBJECT_ORDER.indexOf(a);
                        const idxB = SUBJECT_ORDER.indexOf(b);
                        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                        if (idxA !== -1) return -1;
                        if (idxB !== -1) return 1;
                        return a.localeCompare(b);
                    });

                    if (subjectsArray.length === 0) return;

                    const mainSubjects = subjectsArray.filter(sub => !isSubSubject(sub));
                    const subSubjects = subjectsArray.filter(sub => isSubSubject(sub));

                    const history = typeExams.map(exam => {
                        let rec = null;
                        for(let i=0; i<typeRecords.length; i++){
                            if(typeRecords[i].examId === exam.id && typeRecords[i].studentId === studentId){
                                rec = typeRecords[i];
                                break;
                            }
                        }
                        return {
                            examId: exam.id,
                            examName: exam.name,
                            record: rec || null
                        };
                    });

                    const foundHistory = history.find(h => h.record && h.record.rawName);
                    const rawName = foundHistory ? foundHistory.record.rawName : studentId;
                    const stats = {};
                    history.forEach(h => {
                        if (h.record) {
                            Object.entries(h.record.scores).forEach(([sub, score]) => {
                                if (!stats[sub]) {
                                    stats[sub] = { max: score, min: score, sum: 0, count: 0 };
                                }
                                stats[sub].max = Math.max(stats[sub].max, score);
                                stats[sub].min = Math.min(stats[sub].min, score);
                                stats[sub].sum += score;
                                stats[sub].count += 1;
                            });
                        }
                    });

                    Object.keys(stats).forEach(sub => {
                        stats[sub].avg = (stats[sub].sum / stats[sub].count).toFixed(1);
                    });

                    let title = '定期試験';
                    let colorClass = 'bg-blue-500';
                    let titleColor = 'text-blue-800';
                    if (type === 'benesse') {
                        title = '学力推移調査';
                        colorClass = 'bg-green-500';
                        titleColor = 'text-green-800';
                    } else if (type === 'comprehensive') {
                        title = '学期総合';
                        colorClass = 'bg-purple-500';
                        titleColor = 'text-purple-800';
                    }

                    reportSections.push({
                        type,
                        title,
                        colorClass,
                        titleColor,
                        rawName,
                        mainSubjects,
                        subSubjects,
                        history,
                        stats
                    });
                });

                return reportSections;
            };

            const comprehensiveReportData = useMemo(() => {
                if (!selectedStudentId) return null;
                return getComprehensiveStudentReport(selectedStudentId);
            }, [selectedStudentId, exams, records, currentCohortExams]);

            const currentStudentName = comprehensiveReportData && comprehensiveReportData.length > 0 ? comprehensiveReportData[0].rawName : selectedStudentId;

            // --- ランキング表のデータ生成ロジック (v4.3) ---
            const currentExamRankingSections = useMemo(() => {
                if (!selectedExamId) return [];
                const exam = exams.find(e => e.id === selectedExamId);
                if (!exam) return [];
                const examType = exam.type || 'regular';

                let examRecords = records.filter(r => r.examId === selectedExamId);
                if (rankingClassFilter !== 'ALL') {
                    examRecords = examRecords.filter(r => r.class === rankingClassFilter);
                }

                const filterLabel = rankingClassFilter === 'ALL'
                    ? `学年全体（${examRecords.length}名）`
                    : `${rankingClassFilter}組（${examRecords.length}名）`;

                const buildColumnRanking = (colDef) => {
                    const getScore = (rec) => {
                        if (!rec || !rec.scores) return null;
                        if (rec.scores[colDef.scoreKey] !== undefined && rec.scores[colDef.scoreKey] !== null && !isNaN(rec.scores[colDef.scoreKey])) {
                            return Number(rec.scores[colDef.scoreKey]);
                        }
                        if (colDef.fallbackKeys) {
                            for (let i = 0; i < colDef.fallbackKeys.length; i++) {
                                const fk = colDef.fallbackKeys[i];
                                if (rec.scores[fk] !== undefined && rec.scores[fk] !== null && !isNaN(rec.scores[fk])) {
                                    return Number(rec.scores[fk]);
                                }
                            }
                        }
                        if (colDef.scoreKey === '5教科総点') {
                            const five = ['国語', '社会', '数学', '理科', '英語'];
                            const vals = five.map(s => rec.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                            if (vals.length === 5) return vals.reduce((a, b) => a + Number(b), 0);
                        }
                        if (colDef.scoreKey === '9教科総点') {
                            const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                            const vals = nine.map(s => rec.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                            if (vals.length === 9) return vals.reduce((a, b) => a + Number(b), 0);
                        }
                        return null;
                    };

                    const getDev = (rec) => {
                        if (!colDef.devKey || !rec || !rec.scores) return null;
                        const d = rec.scores[colDef.devKey];
                        return (d !== undefined && d !== null && !isNaN(d)) ? Number(d) : null;
                    };

                    const validList = [];
                    examRecords.forEach(rec => {
                        const sc = getScore(rec);
                        const dv = getDev(rec);
                        if (sc !== null) {
                            validList.push({
                                studentId: rec.studentId,
                                rawName: rec.rawName,
                                grade: rec.grade,
                                class: rec.class,
                                no: rec.no,
                                score: sc,
                                dev: dv
                            });
                        }
                    });

                    // 点数の高い順（同点の場合はクラス・番号順）でソート
                    validList.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        if (a.dev !== null && b.dev !== null && b.dev !== a.dev) return b.dev - a.dev;
                        const codeA = `${a.grade}-${a.class}-${String(a.no).padStart(3, '0')}`;
                        const codeB = `${b.grade}-${b.class}-${String(b.no).padStart(3, '0')}`;
                        return codeA.localeCompare(codeB);
                    });

                    // 順位付け（同じ点数の場合は同じ順位）
                    let currentRank = 1;
                    const rankedList = validList.map((item, idx) => {
                        if (idx > 0) {
                            const prev = validList[idx - 1];
                            if (item.score !== prev.score) {
                                currentRank = idx + 1;
                            }
                        }
                        return { ...item, rank: currentRank };
                    });

                    // 1位〜20位までを抽出（同点20位も含める）
                    const topList = rankedList.filter(item => item.rank <= 20);

                    // 平均点・平均偏差値
                    const avgScore = validList.length > 0
                        ? (validList.reduce((acc, cur) => acc + cur.score, 0) / validList.length).toFixed(1)
                        : null;

                    const validDevList = validList.filter(item => item.dev !== null);
                    const avgDev = validDevList.length > 0
                        ? (validDevList.reduce((acc, cur) => acc + cur.dev, 0) / validDevList.length).toFixed(1)
                        : null;

                    return {
                        ...colDef,
                        topList,
                        avgScore,
                        avgDev,
                        totalCount: validList.length
                    };
                };

                const fiveSubjectCols = [
                    { key: 'kokugo', label: '国語', scoreKey: '国語', headerStyle: 'bg-red-50 text-red-800 border-red-400' },
                    { key: 'sugaku', label: '数学', scoreKey: '数学', headerStyle: 'bg-blue-50 text-blue-800 border-blue-400' },
                    { key: 'shakai', label: '社会', scoreKey: '社会', headerStyle: 'bg-orange-50 text-orange-800 border-orange-400' },
                    { key: 'rika', label: '理科', scoreKey: '理科', headerStyle: 'bg-emerald-50 text-emerald-800 border-emerald-400' },
                    { key: 'eigo', label: '英語', scoreKey: '英語', headerStyle: 'bg-purple-50 text-purple-800 border-purple-400' },
                    { key: 'total5', label: '5教科総点', scoreKey: '5教科総点', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                ];

                if (examType === 'benesse') {
                    const benesseCols = [
                        { key: 'kokugo', label: '国語', scoreKey: '国語点数', devKey: '国語偏差値', headerStyle: 'bg-red-50 text-red-800 border-red-400' },
                        { key: 'sugaku', label: '数学', scoreKey: '数学点数', devKey: '数学偏差値', headerStyle: 'bg-blue-50 text-blue-800 border-blue-400' },
                        { key: 'eigo', label: '英語', scoreKey: '英語点数', devKey: '英語偏差値', headerStyle: 'bg-purple-50 text-purple-800 border-purple-400' },
                        { key: 'total3', label: '3教科', scoreKey: '3教科点数', devKey: '3教科偏差値', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                    ];
                    return [{
                        id: 'benesse_ranking',
                        title: `${exam.name} ランキング表（TOP 20）`,
                        subtitle: '学力推移調査（国語・数学・英語・3教科 ／ 点数・偏差値）',
                        badgeColor: 'bg-green-600',
                        filterLabel,
                        isBenesse: true,
                        columns: benesseCols.map(buildColumnRanking)
                    }];
                }

                if (examType === 'comprehensive') {
                    const subSubjectCols = [
                        { key: 'ongaku', label: '音楽', scoreKey: '音楽', headerStyle: 'bg-pink-50 text-pink-800 border-pink-400' },
                        { key: 'bijutsu', label: '美術', scoreKey: '美術', headerStyle: 'bg-amber-50 text-amber-800 border-amber-400' },
                        { key: 'hotai', label: '保体', scoreKey: '保体', fallbackKeys: ['保健体育'], headerStyle: 'bg-cyan-50 text-cyan-800 border-cyan-400' },
                        { key: 'gika', label: '技家', scoreKey: '技家', fallbackKeys: ['技術家庭', '家庭科'], headerStyle: 'bg-indigo-50 text-indigo-800 border-indigo-400' },
                        { key: 'total9', label: '9教科総点', scoreKey: '9教科総点', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                    ];
                    return [
                        {
                            id: 'comp_main_ranking',
                            title: `${exam.name} ランキング表【5教科】（TOP 20）`,
                            subtitle: '学期総合 - 5教科（国語・数学・社会・理科・英語・5教科総点）',
                            badgeColor: 'bg-purple-600',
                            filterLabel,
                            isBenesse: false,
                            columns: fiveSubjectCols.map(buildColumnRanking)
                        },
                        {
                            id: 'comp_sub_ranking',
                            title: `${exam.name} ランキング表【実技教科】（TOP 20）`,
                            subtitle: '学期総合 - 実技教科（音楽・美術・保体・技家・9教科総点）',
                            badgeColor: 'bg-purple-600',
                            filterLabel,
                            isBenesse: false,
                            columns: subSubjectCols.map(buildColumnRanking)
                        }
                    ];
                }

                // 定期試験 (regular)
                return [{
                    id: 'regular_ranking',
                    title: `${exam.name} ランキング表（TOP 20）`,
                    subtitle: '定期試験（国語・数学・社会・理科・英語・5教科総点）',
                    badgeColor: 'bg-blue-600',
                    filterLabel,
                    isBenesse: false,
                    columns: fiveSubjectCols.map(buildColumnRanking)
                }];
            }, [selectedExamId, exams, records, rankingClassFilter]);

            // --- Navigation Handler ---
            const handleNavigateStudent = (direction) => {
                if (!selectedStudentId || tableData.length === 0) return;
                
                const currentIndex = tableData.findIndex(r => r.studentId === selectedStudentId);
                if (currentIndex === -1) return;

                let nextIndex = currentIndex;
                if (direction === 'next' && currentIndex < tableData.length - 1) {
                    nextIndex = currentIndex + 1;
                } else if (direction === 'prev' && currentIndex > 0) {
                    nextIndex = currentIndex - 1;
                }
                
                if (nextIndex !== currentIndex) {
                    setSelectedStudentId(tableData[nextIndex].studentId);
                }
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!selectedStudentId) return;
                    if (e.key === 'ArrowRight') {
                        handleNavigateStudent('next');
                    } else if (e.key === 'ArrowLeft') {
                        handleNavigateStudent('prev');
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedStudentId, tableData]);

            // --- CSV Export Handler ---
            const handleExportCurrentExamCSV = () => {
                if (!selectedExamId) return;
                const exam = exams.find(e => e.id === selectedExamId);
                if (!exam) return;

                if (tableData.length === 0) {
                    alert('出力するデータがありません。');
                    return;
                }

                const csvData = tableData.map(r => {
                    const row = {
                        '学年': r.grade,
                        '組': r.class,
                        '出席番号': r.no,
                        '氏名': r.rawName,
                        '学園奨学生': r.scholarship || ''
                    };
                    currentSubjects.forEach(sub => {
                        row[sub] = r.scores[sub] !== undefined ? r.scores[sub] : '';
                    });
                    return row;
                });

                const csvContent = Papa.unparse(csvData);
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `${exam.name}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Print PDF Handler ---
            const triggerPrint = (targetIds, typesConfig, includeChartsFlag = false) => {
                setPrintModeType('report');
                setPrintTargetIds(targetIds);
                setPrintTargetTypes(typesConfig);
                setPrintIncludeCharts(includeChartsFlag);
                setIsPrinting(true);
                setTimeout(() => {
                    if(targetIds.length > 1) alert("印刷プレビューが開きます。\n「送信先（プリンター）」を「PDFに保存」にして保存してください。");
                    window.print();
                    setIsPrinting(false);
                    setPrintTargetIds([]);
                }, 600);

                    window.print();

                setIsPrinting(true);
                setTimeout(() => {
                    window.print();
                    setIsPrinting(false);

                setIsPrinting(true);

                    window.print();

            const executePrintFromSettings = () => {
                let targets = [];
                if (printConfig.mode === 'all') {
                    targets = tableData.map(r => r.studentId);
                } else if (printConfig.mode === 'class') {
                    targets = tableData.filter(r => r.class === printConfig.targetClass).map(r => r.studentId);
                } else if (printConfig.mode === 'individual') {
                    targets = printConfig.selectedStudents;
                }

                if (targets.length === 0) {
                    alert('出力対象の生徒が選択されていません。');
                    return;
                }
                
                if (!printConfig.types.regular && !printConfig.types.benesse && !printConfig.types.comprehensive) {
                    alert('出力する試験種別を1つ以上選択してください。');
                    return;
                }

                setIsPrintMenuOpen(false);
                triggerPrint(targets, printConfig.types, printConfig.includeCharts);
            };


            // --- Render Helpers ---
            const renderDiffText = (diff, subjectName = '', extraClass = '') => {
                if (diff === undefined || diff === null || isNaN(diff)) return null;
                const isFloat = typeof subjectName === 'string' && (subjectName.includes('平均') || subjectName.includes('偏差値'));
                const isRank = typeof subjectName === 'string' && (subjectName.includes('席次') || subjectName.includes('順位'));
                let formattedDiff = isFloat ? Number(diff).toFixed(1) : Math.round(diff).toString();
                const diffNum = Number(formattedDiff);

                if (diffNum === 0) return <span className={`text-slate-400 ${extraClass}`}>(±0)</span>;

                if (diffNum > 0) {
                    return <span className={`font-medium ${isRank ? 'text-red-500' : 'text-green-600'} ${extraClass}`}>(+{formattedDiff})</span>;
                } else {
                    return <span className={`font-medium ${isRank ? 'text-green-600' : 'text-red-500'} ${extraClass}`}>({formattedDiff})</span>;

            const renderSortIcon = (key) => {
                if (sortConfig.key !== key) return <span className="text-gray-300 ml-1 text-[10px]">↕</span>;

                if (sortConfig.direction === 'desc') return <span className="text-blue-600 ml-1 text-[10px]" title="点数が大きい順">↓</span>;
                if (sortConfig.direction === 'diff_desc') return <span className="text-green-600 ml-1 text-[12px]" title="伸びた順">↗</span>;

            let selectedExamName = '';
            for(let i=0; i<currentExams.length; i++){

            // --- Report Section Component (Reusable) ---

                                    全{section.history.filter(h=>h.record).length}回分の個人推移
                                </span>
                            </h3>
                            <span className="text-[10px] sm:text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">

                        <div className={`stat-card-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 ${isUltraCompact ? 'gap-1 mb-1.5' : (isCompact ? 'gap-1.5 mb-2' : 'gap-2.5 mb-3')}`}>
                            {cardSubjects.map(sub => {
                                const stat = section.stats[sub];
                                if (!stat) return null;
                                const isFloat = typeof sub === 'string' && (sub.includes('平均') || sub.includes('偏差値'));
                                const isRank = typeof sub === 'string' && (sub.includes('席次') || sub.includes('順位'));
                                // 席次・順位は数字が小さいほうが「最高」、大きいほうが「最低」
                                const bestVal = isRank ? stat.min : stat.max;
                                const worstVal = isRank ? stat.max : stat.min;

                                const displayAvg = isFloat ? Number(stat.avg).toFixed(1) : Math.round(stat.avg).toString();
                                const displayMax = isFloat ? Number(bestVal).toFixed(1) : Math.round(bestVal).toString();
                                const displayMin = isFloat ? Number(worstVal).toFixed(1) : Math.round(worstVal).toString();

                                return (
                                    <div key={sub} className={`${isUltraCompact ? 'p-1' : (isCompact ? 'p-1.5' : 'p-2.5')} rounded-lg border border-slate-300 shadow-sm flex flex-col justify-between bg-white`}>
                                        <div className={`${isUltraCompact ? 'text-[10.5px] mb-0.5 pb-0.5' : (isCompact ? 'text-[11px] mb-0.5 pb-0.5' : 'text-xs sm:text-[13px] mb-1 pb-1')} font-extrabold text-slate-800 border-b border-slate-200 truncate`} title={sub}>

                                                {displayAvg}
                                            </span>
                                        </div>

                            {/* Settings Button & Clear Data */}

                                            <button 
                                                onClick={() => handleNavigateStudent('prev')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) > 0 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) <= 0}
                                                title="前の生徒 (←)"
                                            >
                                                <IconChevronLeft />
                                            </button>

                                            <div className="flex items-center gap-3 sm:gap-4 mx-1 sm:mx-2 w-48 sm:w-72">
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 bg-blue-500 rounded-full flex items-center justify-center text-lg sm:text-xl font-bold shadow-inner shrink-0">
                                                    {currentStudentName ? currentStudentName.charAt(0) : ''}
                                                </div>
                                                <div className="overflow-hidden">
                                                    <div className="flex items-center gap-2 mb-0.5 sm:mb-1">
                                                        <span className="text-[10px] text-slate-400 font-mono shrink-0 bg-slate-700 px-1.5 py-0.5 rounded">
                                                            {tableData.findIndex(r => r.studentId === selectedStudentId) + 1} / {tableData.length}
                                                        </span>
                                                    </div>
                                                    <h2 className="text-xl sm:text-2xl font-bold leading-none truncate">{currentStudentName}</h2>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => handleNavigateStudent('next')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) < tableData.length - 1 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) >= tableData.length - 1}
                                                title="次の生徒 (→)"
                                            >
                                                <IconChevronRight />
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-2 sm:gap-3">
                                            <label className="hidden md:flex items-center gap-1.5 text-xs bg-slate-700/70 hover:bg-slate-700 px-2.5 py-1.5 rounded border border-slate-600 cursor-pointer select-none">
                                                <input
                                                    type="checkbox"
                                                    className="w-3.5 h-3.5 accent-blue-500 rounded"
                                                    checked={printConfig.includeCharts}
                                                    onChange={e => setPrintConfig({...printConfig, includeCharts: e.target.checked})}
                                                />
                                                <span className="font-bold text-slate-200">グラフも一緒に印刷</span>
                                            </label>
                                            <button 
                                                onClick={() => {
                                                    // 個人の場合は現在選択中のグラフ有無設定を使って出力
                                                    triggerPrint([selectedStudentId], printConfig.types, printConfig.includeCharts);
                                                }}
                                                className="hidden sm:flex text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded border border-emerald-500 items-center gap-1 shadow-sm transition-colors"
                                            >
                                                <IconPrinter /> この生徒をPDF出力 ({printConfig.includeCharts ? 'グラフあり' : '表のみ'})
                                            </button>
                                            <button onClick={() => setSelectedStudentId(null)} className="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-1.5 sm:p-2 rounded-full shrink-0">
                                                <IconX />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Modal Body */}
                                    <div className="p-4 sm:p-6 overflow-y-auto bg-slate-50 flex-1">
                                        {comprehensiveReportData.length === 0 ? (
                                            <div className="text-center text-slate-500 py-10">データがありません</div>
                                        ) : (
                                            comprehensiveReportData.map(section => (
                                                <ReportSection key={section.type} section={section} isPrint={false} />
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- PRINT ONLY TEMPLATE (Hides during normal viewing) --- */}
                    <div className="print-only">
                        {/* クラス間比較（A組 vs B組）の印刷シート */}
                        {isPrinting && printModeType === 'class_compare' && (
                            <div className="print-sheet">
                                <ClassComparisonView
                                    cohorts={visibleCohorts}
                                    currentCohort={currentCohort}
                                    onSelectCohort={() => {}}
                                    cohortExams={currentCohortExams}
                                    records={records}
                                    classCompareConfig={classCompareConfig}
                                    setClassCompareConfig={setClassCompareConfig}
                                    isPrint={true}
                                />
                            </div>
                        )}

                        {/* 過年度比較（パターンA）の印刷シート */}
                        {isPrinting && printModeType === 'cohort_compare' && (
                            <div className="print-sheet">
                                <CrossCohortComparisonView
                                    cohorts={visibleCohorts}
                                    exams={exams}
                                    records={records}
                                    compareConfig={compareConfig}
                                    setCompareConfig={setCompareConfig}
                                    isPrint={true}
                                />
                            </div>
                        )}

                        {isPrinting && printModeType === 'ranking' && currentExamRankingSections.map((sec) => {
                            // 20位タイが極めて多い場合（35行超など）のみ縮小し、通常時はA4縦1枚いっぱいに広げて表示
                            let maxRows = 20;
                            sec.columns.forEach(c => {
                                if (c.topList.length > maxRows) maxRows = c.topList.length;
                            });
                            const rowH = Math.max(24, Math.min(43, Math.floor((sec.isBenesse ? 830 : 845) / maxRows)));
                            const estimatedH = 155 + maxRows * rowH;
                            const targetMaxH = 1015;
                            const rankingZoom = estimatedH > targetMaxH
                                ? Math.max(0.65, Number((targetMaxH / estimatedH).toFixed(3)))
                                : 1;

                            return (
                                <div key={sec.id} className="print-sheet" style={{ zoom: rankingZoom }}>
                                    <RankingSectionView section={sec} isPrint={true} hideNames={isRankingNameHidden} />
                                </div>
                            );
                        })}

                        {isPrinting && printModeType === 'report' && printTargetIds.map((targetStudentId) => {
                            const detailData = getComprehensiveStudentReport(targetStudentId);
                            if (!detailData || detailData.length === 0) return null;
                            
                            // 選択された試験種別だけをフィルター
                            const filteredData = detailData.filter(section => printTargetTypes[section.type]);
                            if (filteredData.length === 0) return null;

                            const studentName = filteredData[0].rawName;

                            // 実技教科が含まれるセクション（学期総合など）は、1枚目：主要5教科、2枚目：実技・9教科総合の2シートに分割する
                            const printSheets = [];
                            filteredData.forEach((section) => {
                                if (section.subSubjects && section.subSubjects.length > 0) {
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_main`,
                                        section,
                                        printPart: 'main',
                                        headerSubtitle: `${section.title} - 主要5教科`,
                                        subjects: section.mainSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.mainSubjects, 'main')
                                    });
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_sub`,
                                        section,
                                        printPart: 'sub',
                                        headerSubtitle: `${section.title} - 実技4教科・9教科総合`,
                                        subjects: section.subSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.subSubjects, 'sub')
                                    });
                                } else {
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_main`,
                                        section,
                                        printPart: 'main',
                                        headerSubtitle: section.title,
                                        subjects: section.mainSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.mainSubjects, 'main')
                                    });
                                }
                            });

                            return (
                                <React.Fragment key={targetStudentId}>
                                    {printSheets.map((sheet) => {
                                        const { section, printPart, headerSubtitle, subjects, chartSubs } = sheet;
                                        const totalSubs = subjects.length;
                                        const cardRows = Math.ceil(totalSubs / 5);
                                        const examCount = section.history.length;
                                        const chartCount = chartSubs.length > 0 ? 1 : 0;

                                        // グラフの有無・試験回数に応じてコンパクトレベルを自動決定
                                        let compactLevel = 'normal';
                                        if (printIncludeCharts) {
                                            if (examCount >= 9) {
                                                compactLevel = 'ultra';
                                            } else {
                                                compactLevel = 'compact';
                                            }
                                        } else {
                                            if (examCount >= 13) {
                                                compactLevel = 'ultra';
                                            } else if (examCount >= 9) {
                                                compactLevel = 'compact';
                                            } else {
                                                compactLevel = 'normal';
                                            }
                                        }

                                        // グラフのSVG高さを試験回数に応じて自動調整
                                        let printSvgHeight = 200;
                                        if (examCount <= 6) printSvgHeight = 225;
                                        else if (examCount <= 10) printSvgHeight = 195;
                                        else if (examCount <= 13) printSvgHeight = 175;
                                        else printSvgHeight = 160;

                                        // A4縦1枚（安全上限 900px）に必ず収まるようにコンテンツ高さを推定し、必要に応じてzoomを適用
                                        const cardRowH = compactLevel === 'ultra' ? 48 : (compactLevel === 'compact' ? 58 : 72);
                                        const rowH = compactLevel === 'ultra' ? 22 : (compactLevel === 'compact' ? 27 : 34);
                                        const tableBlockH = 48 + examCount * rowH;
                                        const chartBlockH = printIncludeCharts ? chartCount * (printSvgHeight + 44) : 0;
                                        const estimatedHeight = 42 + 28 + (cardRows * cardRowH) + tableBlockH + chartBlockH;

                                        const targetMaxH = 900;
                                        const sheetZoom = estimatedHeight > targetMaxH
                                            ? Math.max(0.55, Number((targetMaxH / estimatedHeight).toFixed(3)))
                                            : 1;

                                        return (
                                            <div key={sheet.key} className="print-sheet" style={{ zoom: sheetZoom }}>
                                                {/* Sheet Header */}
                                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px', borderBottom: '2px solid #1e293b', paddingBottom: '5px' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center' }}>
                                                        <div style={{ width: '30px', height: '30px', backgroundColor: '#3b82f6', borderRadius: '50%', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '15px', marginRight: '10px', WebkitPrintColorAdjust: 'exact' }}>
                                                            {studentName.charAt(0)}
                                                        </div>
                                                        <h2 style={{ fontSize: '20px', fontWeight: 'bold', margin: 0, color: '#0f172a' }}>
                                                            {studentName}
                                                            <span style={{ fontSize: '11px', fontWeight: 'normal', color: '#64748b', marginLeft: '10px' }}>
                                                                個人成績レポート（{headerSubtitle}）
                                                            </span>
                                                        </h2>
                                                    </div>
                                                </div>

                                                {/* Section Content (Stats + Table + Chart in the same sheet) */}
                                                <ReportSection
                                                    section={section}
                                                    isPrint={true}
                                                    printPart={printPart}
                                                    includeChartsInPrint={printIncludeCharts}
                                                    printSvgHeight={printSvgHeight}
                                                    compactLevel={compactLevel}
                                                />
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
