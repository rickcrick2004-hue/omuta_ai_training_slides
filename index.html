                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* サブタブ③：学年上位層（TOP10 / TOP20 / TOP30）のクラス別シェア比較 */}
                            {singleSubTab === 'top_share' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="px-4 py-2.5 bg-slate-800 text-white flex flex-wrap justify-between items-center gap-2">
                                        <span className="text-xs sm:text-sm font-bold">
                                            🏆 【{activeExam.name}】教科別 学年上位層（TOP 10 / TOP 20 / TOP 30）のクラス別人数シェア
                                        </span>
                                        <span className="text-[11px] text-slate-300">※同点の場合は全員含めた人数で集計</span>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-center whitespace-nowrap border-separate border-spacing-0">
                                            <thead className="bg-slate-100 text-slate-600">
                                                <tr>
                                                    <th className="px-3 py-2 text-left font-bold border-b border-slate-200 min-w-[100px]">科目</th>
                                                    <th className="px-3 py-2 font-bold border-b border-slate-200 min-w-[210px]">学年 TOP 10 内訳</th>
                                                    <th className="px-3 py-2 font-bold border-b border-slate-200 border-l min-w-[210px]">学年 TOP 20 内訳</th>
                                                    <th className="px-3 py-2 font-bold border-b border-slate-200 border-l min-w-[210px]">学年 TOP 30 内訳</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {topShareBySubject.map(row => {
                                                    const renderShareCell = (shareObj) => {
                                                        const total = shareObj.total || 1;
                                                        return (
                                                            <div className="flex flex-col gap-1 px-2">
                                                                <div className="flex items-center justify-between text-[11.5px] font-mono">
                                                                    {singleExamClassData.classes.map(clsObj => {
                                                                        const c = shareObj.counts[clsObj.className] || 0;
                                                                        return (
                                                                            <span key={clsObj.className} className="font-extrabold" style={{ color: clsObj.palette.color }}>
                                                                                {clsObj.palette.label}: {c}人
                                                                            </span>
                                                                        );
                                                                    })}
                                                                </div>
                                                                <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden flex">
                                                                    {singleExamClassData.classes.map(clsObj => {
                                                                        const c = shareObj.counts[clsObj.className] || 0;
                                                                        const pct = (c / total) * 100;
                                                                        return (
                                                                            <div
                                                                                key={clsObj.className}
                                                                                style={{ width: `${pct}%`, backgroundColor: clsObj.palette.color }}
                                                                                className="h-full"
                                                                            ></div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    };

                                                    return (
                                                        <tr key={row.subject} className="hover:bg-slate-50">
                                                            <td className="px-3 py-2.5 text-left font-extrabold text-slate-800 border-b border-slate-100 bg-slate-50/60">
                                                                {row.subject}
                                                            </td>
                                                            <td className="px-2 py-2 border-b border-slate-100">{renderShareCell(row.top10)}</td>
                                                            <td className="px-2 py-2 border-b border-l border-slate-100">{renderShareCell(row.top20)}</td>
                                                            <td className="px-2 py-2 border-b border-l border-slate-100">{renderShareCell(row.top30)}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* モード②：通年推移でのクラス間比較（A組 vs B組 vs 学年全体） */}
                    {/* ========================================================= */}
                    {mode === 'trend' && (
                        <div className="space-y-4">
                            {(() => {
                                const isCount = trendMetricType === 'count_gte' || trendMetricType === 'count_lt' || trendMetricType === 'top_n';
                                const isRate = trendMetricType === 'rate_gte' || trendMetricType === 'rate_lt';
                                const isDev = !isCount && !isRate && trendSubject.includes('偏差値');

                                let minY = 0, maxY = 100, step = 20;
                                if (isCount) {
                                    let maxVal = 10;
                                    classTrendSeries.forEach(s => {
                                        // 学年全体の人数に引きずられないよう、TOP_N以外はクラスごとの最大人数を基準にする
                                        if (s.key === 'ALL' && trendMetricType !== 'top_n') return;
                                        s.points.forEach(pt => {
                                            if (pt.val !== null && pt.val > maxVal) maxVal = pt.val;
                                        });
                                    });
                                    minY = 0;
                                    if (maxVal <= 10) { maxY = 10; step = 2; }
                                    else if (maxVal <= 25) { maxY = Math.ceil(maxVal / 5) * 5; step = 5; }
                                    else if (maxVal <= 45) { maxY = Math.ceil(maxVal / 10) * 10; step = 10; }
                                    else { maxY = Math.ceil(maxVal / 20) * 20; step = 20; }
                                } else if (isRate) {
                                    minY = 0; maxY = 100; step = 20;
                                } else if (isDev) {
                                    minY = 30; maxY = 80; step = 10;
                                } else if (trendSubject === '5教科総点') {
                                    minY = 100; maxY = 450; step = 50;
                                } else if (trendSubject === '9教科総点') {
                                    minY = 200; maxY = 850; step = 100;
                                } else if (trendSubject === '3教科点数') {
                                    minY = 50; maxY = 300; step = 50;
                                }

                                const ticks = [];
                                for (let t = minY; t <= maxY; t += step) ticks.push(t);

                                const svgW = 780;
                                const svgH = isPrint ? 255 : 290;
                                const padL = 52;
                                const padR = 26;
                                const padT = 26;
                                const padB = 50;
                                const plotW = svgW - padL - padR;
                                const plotH = svgH - padT - padB;
                                const count = typeExams.length;

                                const getX = (i) => {
                                    if (count <= 1) return padL + plotW / 2;
                                    const offset = count <= 6 ? 48 : 34;
                                    return padL + offset + (i / (count - 1)) * (plotW - offset * 2);
                                };
                                const getY = (v) => {
                                    const clamped = Math.max(minY, Math.min(maxY, v));
                                    return padT + plotH - ((clamped - minY) / (maxY - minY || 1)) * plotH;
                                };

                                // グラフに描画するシリーズ（人数カウントモード時は学年全体を除外してクラス同士を見やすくする）
                                const seriesToDraw = isCount
                                    ? classTrendSeries.filter(s => s.key !== 'ALL')
                                    : classTrendSeries;

                                const metricTitle = (() => {
                                    const thLabel = trendSubject.includes('偏差値') ? `偏差値${trendThreshold}` : `${trendThreshold}点`;
                                    if (trendMetricType === 'average') return `${trendSubject}（平均推移）`;
                                    if (trendMetricType === 'median') return `${trendSubject}（中央値推移）`;
                                    if (trendMetricType === 'count_gte') return `${trendSubject}（${thLabel}以上の人数推移）`;
                                    if (trendMetricType === 'rate_gte') return `${trendSubject}（${thLabel}以上の割合%推移）`;
                                    if (trendMetricType === 'count_lt') return `${trendSubject}（${thLabel}未満の人数推移）`;
                                    if (trendMetricType === 'top_n') return `${trendSubject}（学年TOP ${trendTopN}以内のクラス別人数推移）`;
                                    return trendSubject;
                                })();

                                return (
                                    <>
                                        {/* 1. クラス間 通年推移折れ線グラフ */}
                                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 sm:p-4">
                                            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                                <h4 className="text-xs sm:text-sm font-extrabold text-slate-800">
                                                    📈 {currentCohort.name} クラス間 通年推移グラフ：【{metricTitle}】
                                                </h4>
                                                <div className="flex flex-wrap items-center gap-3">
                                                    {seriesToDraw.map(s => (
                                                        <span key={s.key} className="inline-flex items-center gap-1.5 text-xs font-extrabold text-slate-700">
                                                            <span
                                                                className="w-3 h-3 rounded-full"
                                                                style={{
                                                                    backgroundColor: s.palette.color,
                                                                    border: s.palette.isAll ? '2px dashed white' : 'none'
                                                                }}
                                                            ></span>
                                                            {s.palette.label}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                            {count === 0 ? (
                                                <div className="py-10 text-center text-slate-400 text-xs">試験データがありません</div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto min-w-[500px] select-none">
                                                        {ticks.map(t => {
                                                            const y = getY(t);
                                                            return (
                                                                <g key={t}>
                                                                    <line x1={padL} y1={y} x2={svgW - padR} y2={y} stroke="#e2e8f0" strokeWidth="1" />
                                                                    <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#64748b">
                                                                        {isCount ? `${t}人` : (isRate ? `${t}%` : t)}
                                                                    </text>
                                                                </g>
                                                            );
                                                        })}
                                                        {typeExams.map((ex, i) => {
                                                            const x = getX(i);
                                                            return (
                                                                <g key={ex.id}>
                                                                    <line x1={x} y1={padT} x2={x} y2={svgH - padB} stroke="#f1f5f9" strokeWidth="1" />
                                                                    <text x={x} y={svgH - padB + 20} textAnchor="middle" fontSize="10.5" fontWeight="bold" fill="#334155">
                                                                        {ex.name}
                                                                    </text>
                                                                </g>
                                                            );
                                                        })}
                                                        {seriesToDraw.map((series, sIdx) => {
                                                            const validPts = [];
                                                            series.points.forEach((pt, i) => {
                                                                if (pt.val !== null && pt.val !== undefined) {
                                                                    validPts.push({ x: getX(i), y: getY(pt.val), val: pt.val });
                                                                }
                                                            });
                                                            if (validPts.length === 0) return null;
                                                            const pathD = validPts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                                                            return (
                                                                <g key={series.key}>
                                                                    {validPts.length > 1 && (
                                                                        <path
                                                                            d={pathD}
                                                                            fill="none"
                                                                            stroke={series.palette.color}
                                                                            strokeWidth={series.palette.isAll ? '2.5' : '3'}
                                                                            strokeDasharray={series.palette.isAll ? '5 4' : 'none'}
                                                                            strokeLinecap="round"
                                                                            strokeLinejoin="round"
                                                                        />
                                                                    )}
                                                                    {validPts.map((p, idx) => (
                                                                        <g key={idx}>
                                                                            <circle cx={p.x} cy={p.y} r="4.5" fill={series.palette.color} stroke="#fff" strokeWidth="1.8" />
                                                                            <text
                                                                                x={p.x}
                                                                                y={p.y - 8 - (sIdx % 2) * 5}
                                                                                textAnchor="middle"
                                                                                fontSize="10.5"
                                                                                fontWeight="bold"
                                                                                fill={series.palette.color}
                                                                                stroke="#ffffff"
                                                                                strokeWidth="3"
                                                                                style={{ paintOrder: 'stroke' }}
                                                                            >
                                                                                {isCount ? `${Math.round(p.val)}人` : (isRate ? `${Number(p.val).toFixed(1)}%` : Number(p.val).toFixed(1))}
                                                                            </text>
                                                                        </g>
                                                                    ))}
                                                                </g>
                                                            );
                                                        })}
                                                    </svg>
                                                </div>
                                            )}
                                        </div>

                                        {/* 2. クラス間 通年推移マトリクス表（A組・B組・A-B差・学年全体） */}
                                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                            <div className="px-4 py-2.5 bg-slate-800 text-white flex justify-between items-center">
                                                <span className="text-xs sm:text-sm font-bold">
                                                    📋 【{metricTitle}】クラス別・試験別 推移一覧表
                                                </span>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="report-table w-full text-xs text-center whitespace-nowrap border-separate border-spacing-0">
                                                    <thead className="bg-slate-100 text-slate-600">
                                                        <tr>
                                                            <th className="px-3 py-2 text-left font-bold border-b border-slate-200 sticky left-0 bg-slate-100 z-10 min-w-[100px]">クラス</th>
                                                            {typeExams.map(ex => (
                                                                <th key={ex.id} className="px-2.5 py-2 font-bold border-b border-slate-200 min-w-[90px]">{ex.name}</th>
                                                            ))}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {classTrendSeries.map(series => (
                                                            <tr key={series.key} className={`${series.palette.isAll ? 'bg-slate-50 font-bold' : 'hover:bg-slate-50'}`}>
                                                                <td className="px-3 py-2.5 text-left font-extrabold sticky left-0 bg-white z-10 border-b border-slate-100">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: series.palette.color }}></span>
                                                                        <span className="text-slate-800">{series.palette.label}</span>
                                                                    </div>
                                                                </td>
                                                                {series.points.map(pt => (
                                                                    <td key={pt.examId} className="px-2.5 py-2 border-b border-l border-slate-100 font-mono">
                                                                        {pt.val !== null ? (
                                                                            <div className="flex flex-col items-center leading-tight">
                                                                                <span className="text-[13px] font-extrabold text-slate-800">
                                                                                    {isCount ? `${Math.round(pt.val)}人` : (isRate ? `${Number(pt.val).toFixed(1)}%` : Number(pt.val).toFixed(1))}
                                                                                </span>
                                                                                {pt.rate !== undefined && isCount && (
                                                                                    <span className="text-[9.5px] text-slate-400">({pt.rate.toFixed(1)}%)</span>
                                                                                )}
                                                                            </div>
                                                                        ) : <span className="text-slate-300">-</span>}
                                                                    </td>
                                                                ))}
                                                            </tr>
                                                        ))}
                                                        {/* A組 - B組 の推移差分行 */}
                                                        {classTrendSeries.length >= 3 && (
                                                            <tr className="bg-amber-50/60">
                                                                <td className="px-3 py-2 text-left font-extrabold text-amber-900 sticky left-0 bg-amber-50 z-10 border-b border-slate-200">
                                                                    {classTrendSeries[0].palette.label} − {classTrendSeries[1].palette.label} 差
                                                                </td>
                                                                {typeExams.map((ex, idx) => {
                                                                    const ptA = classTrendSeries[0].points[idx];
                                                                    const ptB = classTrendSeries[1].points[idx];
                                                                    if (!ptA || !ptB || ptA.val === null || ptB.val === null) {
                                                                        return <td key={ex.id} className="px-2.5 py-2 border-b border-l border-slate-200 text-slate-300">-</td>;
                                                                    }
                                                                    const diff = ptA.val - ptB.val;
                                                                    const colorCls = diff > 0.04 ? 'text-red-600' : (diff < -0.04 ? 'text-blue-600' : 'text-slate-500');
                                                                    return (
                                                                        <td key={ex.id} className={`px-2.5 py-2 font-mono font-extrabold text-xs border-b border-l border-slate-200 ${colorCls}`}>
                                                                            {isCount
                                                                                ? `${diff > 0 ? `+${Math.round(diff)}` : Math.round(diff)}人`
                                                                                : (isRate ? `${diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1)}pt` : (diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1)))}
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        };

        // --- 生徒向けダッシュボード（学年全体のヒストグラム ＆ 相関散布図） ---
        const StudentDashboardView = ({
            cohort,
            cohortExams,
            records,
            dashboardConfig,
            setDashboardConfig
        }) => {
            const { mode = 'histogram', examId = '', histSubject = '5教科総点', scatterXSubject = '数学', scatterYSubject = '英語' } = dashboardConfig;

            const activeExam = useMemo(() => {
                if (cohortExams.length === 0) return null;
                return cohortExams.find(e => e.id === examId) || cohortExams[cohortExams.length - 1];
            }, [cohortExams, examId]);

            const examRecords = useMemo(() => {
                if (!activeExam) return [];
                return records.filter(r => r.examId === activeExam.id);
            }, [records, activeExam]);

            const examType = activeExam ? (activeExam.type || 'regular') : 'regular';

            const compareSubjects = useMemo(() => {
                const isRank = (s) => s.includes('席次') || s.includes('順位');
                const subSet = new Set();
                examRecords.forEach(r => {
                    if (r.scores) {
                        Object.keys(r.scores).forEach(s => {
                            if (!isRank(s)) subSet.add(s);
                        });
                    }
                });
                if (examType === 'benesse') {
                    ['国語点数', '国語偏差値', '数学点数', '数学偏差値', '英語点数', '英語偏差値', '3教科点数', '3教科偏差値'].forEach(s => subSet.add(s));
                } else if (examType === 'comprehensive') {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点', '音楽', '美術', '保体', '技家', '9教科総点', '9教科平均点'].forEach(s => subSet.add(s));
                } else {
                    ['国語', '社会', '数学', '理科', '英語', '5教科総点', '5教科平均点'].forEach(s => subSet.add(s));
                }
                const arr = Array.from(subSet);
                arr.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
                return arr;
            }, [examRecords, examType]);

            useEffect(() => {
                let nextHist = histSubject;
                let nextX = scatterXSubject;
                let nextY = scatterYSubject;
                const defHist = examType === 'benesse' ? '3教科偏差値' : '5教科総点';
                const defX = examType === 'benesse' ? '数学偏差値' : '数学';
                const defY = examType === 'benesse' ? '英語偏差値' : '英語';

                if (compareSubjects.length > 0 && !compareSubjects.includes(histSubject)) nextHist = compareSubjects.includes(defHist) ? defHist : compareSubjects[0];
                if (compareSubjects.length > 0 && !compareSubjects.includes(scatterXSubject)) nextX = compareSubjects.includes(defX) ? defX : compareSubjects[0];
                if (compareSubjects.length > 0 && !compareSubjects.includes(scatterYSubject)) nextY = compareSubjects.includes(defY) ? defY : (compareSubjects[1] || compareSubjects[0]);

                if (nextHist !== histSubject || nextX !== scatterXSubject || nextY !== scatterYSubject || (examId !== activeExam?.id)) {
                    setDashboardConfig(prev => ({
                        ...prev,
                        histSubject: nextHist,
                        scatterXSubject: nextX,
                        scatterYSubject: nextY,
                        examId: activeExam ? activeExam.id : ''
                    }));
                }
            }, [compareSubjects, histSubject, scatterXSubject, scatterYSubject, examType, activeExam, examId]);

            const getSubjectRangeAndBands = (subject) => {
                let min = 0, max = 100, step = 10, bandStep = 10;
                if (subject.includes('偏差値') || examType === 'benesse') {
                    min = 20; max = 80; step = 10; bandStep = 5;
                } else if (subject === '5教科総点') {
                    min = 0; max = 500; step = 50; bandStep = 50;
                } else if (subject === '9教科総点') {
                    min = 0; max = 900; step = 100; bandStep = 100;
                } else if (subject === '3教科点数') {
                    min = 0; max = 300; step = 50; bandStep = 30;
                }
                const bands = [];
                for (let i = min; i < max; i += bandStep) {
                    bands.push({ min: i, max: i + bandStep, label: `${i}〜${i + bandStep - 1}`, count: 0 });
                }
                if (bands.length > 0) {
                    bands[bands.length - 1].max = max + 1;
                    bands[bands.length - 1].label = `${bands[bands.length - 1].min}〜${max}`;
                }
                return { min, max, step, bands };
            };

            return (
                <div className="space-y-4">
                    {/* 操作パネル */}
                    <div className="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">対象試験: {activeExam ? activeExam.name : '-'}</span>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200 ml-auto">
                                <button
                                    onClick={() => setDashboardConfig(prev => ({ ...prev, mode: 'histogram' }))}
                                    className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-1.5 ${mode === 'histogram' ? 'bg-cyan-600 text-white shadow' : 'text-slate-600 hover:bg-white/60'}`}
                                >
                                    <IconChartBar /> 成績分布（ヒストグラム）
                                </button>
                                <button
                                    onClick={() => setDashboardConfig(prev => ({ ...prev, mode: 'scatter' }))}
                                    className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-1.5 ${mode === 'scatter' ? 'bg-cyan-600 text-white shadow' : 'text-slate-600 hover:bg-white/60'}`}
                                >
                                    <IconScatter /> 相関図（散布図）
                                </button>
                            </div>
                        </div>

                        {mode === 'histogram' && (
                            <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-100">
                                <span className="text-xs font-bold text-slate-500 mr-1">分布を見る科目:</span>
                                {compareSubjects.map(sub => (
                                    <button
                                        key={sub}
                                        onClick={() => setDashboardConfig(prev => ({ ...prev, histSubject: sub }))}
                                        className={`px-3 py-1 rounded-full text-xs font-bold border transition-all ${histSubject === sub ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}
                                    >
                                        {sub}
                                    </button>
                                ))}
                            </div>
                        )}

                        {mode === 'scatter' && (
                            <div className="flex flex-col gap-2 pt-2 border-t border-slate-100">
                                <div className="flex flex-wrap items-center gap-1.5">
                                    <span className="text-xs font-bold text-slate-500 mr-1">X軸（横）の科目:</span>
                                    {compareSubjects.map(sub => (
                                        <button
                                            key={sub}
                                            onClick={() => setDashboardConfig(prev => ({ ...prev, scatterXSubject: sub }))}
                                            className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-all ${scatterXSubject === sub ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}
                                        >
                                            {sub}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex flex-wrap items-center gap-1.5">
                                    <span className="text-xs font-bold text-slate-500 mr-1">Y軸（縦）の科目:</span>
                                    {compareSubjects.map(sub => (
                                        <button
                                            key={sub}
                                            onClick={() => setDashboardConfig(prev => ({ ...prev, scatterYSubject: sub }))}
                                            className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-all ${scatterYSubject === sub ? 'bg-pink-600 text-white border-pink-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}
                                        >
                                            {sub}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* グラフ描画エリア */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-6 min-h-[450px]">
                        {mode === 'histogram' && (() => {
                            const { bands } = getSubjectRangeAndBands(histSubject);
                            let validCount = 0;
                            let sum = 0;
                            let maxScore = -999;

                            examRecords.forEach(r => {
                                const val = getStudentSubjectScore(r, histSubject);
                                if (val !== null && !isNaN(val)) {
                                    validCount++;
                                    sum += val;
                                    if (val > maxScore) maxScore = val;
                                    for (let b of bands) {
                                        if (val >= b.min && val < b.max) {
                                            b.count++;
                                            break;
                                        }
                                    }
                                }
                            });

                            const maxCount = Math.max(1, ...bands.map(b => b.count));
                            const yStep = maxCount <= 10 ? 2 : (maxCount <= 25 ? 5 : (maxCount <= 50 ? 10 : 20));
                            const maxY = Math.ceil(maxCount / yStep) * yStep;
                            const yTicks = [];
                            for (let i = 0; i <= maxY; i += yStep) yTicks.push(i);

                            const svgW = 800;
                            const svgH = 380;
                            const padL = 50;
                            const padR = 20;
                            const padT = 20;
                            const padB = 40;
                            const plotW = svgW - padL - padR;
                            const plotH = svgH - padT - padB;
                            const bandW = plotW / bands.length;

                            return (
                                <div className="flex flex-col h-full">
                                    <div className="flex justify-between items-end mb-4">
                                        <h3 className="text-lg font-extrabold text-slate-800">学年全体の成績分布（{histSubject}）</h3>
                                        <div className="flex gap-4">
                                            <div className="text-center">
                                                <div className="text-[10px] text-slate-500 font-bold">受験者数</div>
                                                <div className="font-extrabold text-lg text-slate-700">{validCount}人</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] text-slate-500 font-bold">学年平均</div>
                                                <div className="font-extrabold text-lg text-blue-600">{validCount > 0 ? (sum / validCount).toFixed(1) : '-'}</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] text-slate-500 font-bold">学年最高</div>
                                                <div className="font-extrabold text-lg text-red-600">{validCount > 0 ? (histSubject.includes('偏差値') ? maxScore.toFixed(1) : Math.round(maxScore)) : '-'}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-x-auto">
                                        <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto min-w-[600px] select-none">
                                            {yTicks.map(t => {
                                                const y = padT + plotH - (t / maxY) * plotH;
                                                return (
                                                    <g key={t}>
                                                        <line x1={padL} y1={y} x2={svgW - padR} y2={y} stroke="#e2e8f0" strokeWidth="1" />
                                                        <text x={padL - 10} y={y + 4} textAnchor="end" fontSize="12" fill="#64748b">{t}人</text>
                                                    </g>
                                                );
                                            })}
                                            {bands.map((b, i) => {
                                                const x = padL + i * bandW;
                                                const barW = bandW * 0.8;
                                                const barX = x + (bandW - barW) / 2;
                                                const h = (b.count / maxY) * plotH;
                                                const y = padT + plotH - h;
                                                return (
                                                    <g key={i}>
                                                        <rect x={barX} y={y} width={barW} height={h} rx="4" fill="#0ea5e9" opacity="0.85">
                                                            <title>{b.label} : {b.count}人</title>
                                                        </rect>
                                                        {b.count > 0 && (
                                                            <text x={x + bandW / 2} y={y - 6} textAnchor="middle" fontSize="13" fontWeight="bold" fill="#0284c7">
                                                                {b.count}
                                                            </text>
                                                        )}
                                                        <text x={x + bandW / 2} y={svgH - padB + 20} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#475569">
                                                            {b.label}
                                                        </text>
                                                    </g>
                                                );
                                            })}
                                        </svg>
                                    </div>
                                </div>
                            );
                        })()}

                        {mode === 'scatter' && (() => {
                            const rangeX = getSubjectRangeAndBands(scatterXSubject);
                            const rangeY = getSubjectRangeAndBands(scatterYSubject);

                            const points = [];
                            let sumX = 0, sumY = 0, count = 0;
                            examRecords.forEach(r => {
                                const vx = getStudentSubjectScore(r, scatterXSubject);
                                const vy = getStudentSubjectScore(r, scatterYSubject);
                                if (vx !== null && !isNaN(vx) && vy !== null && !isNaN(vy)) {
                                    points.push({ x: vx, y: vy });
                                    sumX += vx;
                                    sumY += vy;
                                    count++;
                                }
                            });

                            const avgX = count > 0 ? sumX / count : 0;
                            const avgY = count > 0 ? sumY / count : 0;

                            // 相関係数(r)
                            let num = 0, denX = 0, denY = 0;
                            points.forEach(p => {
                                const dx = p.x - avgX;
                                const dy = p.y - avgY;
                                num += dx * dy;
                                denX += dx * dx;
                                denY += dy * dy;
                            });
                            const rVal = (denX > 0 && denY > 0) ? num / Math.sqrt(denX * denY) : 0;

                            const svgW = 600;
                            const svgH = 600;
                            const padL = 60;
                            const padR = 30;
                            const padT = 30;
                            const padB = 60;
                            const plotW = svgW - padL - padR;
                            const plotH = svgH - padT - padB;

                            const getX = (val) => padL + ((val - rangeX.min) / (rangeX.max - rangeX.min)) * plotW;
                            const getY = (val) => padT + plotH - ((val - rangeY.min) / (rangeY.max - rangeY.min)) * plotH;

                            const xTicks = [];
                            for (let i = rangeX.min; i <= rangeX.max; i += rangeX.step) xTicks.push(i);
                            const yTicks = [];
                            for (let i = rangeY.min; i <= rangeY.max; i += rangeY.step) yTicks.push(i);

                            return (
                                <div className="flex flex-col h-full items-center">
                                    <div className="w-full flex justify-between items-end mb-2 max-w-2xl">
                                        <h3 className="text-lg font-extrabold text-slate-800">2科目の相関図（{scatterXSubject} × {scatterYSubject}）</h3>
                                        <div className="flex gap-4">
                                            <div className="text-center">
                                                <div className="text-[10px] text-slate-500 font-bold">プロット数</div>
                                                <div className="font-extrabold text-lg text-slate-700">{count}人</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] text-slate-500 font-bold">相関係数 (r)</div>
                                                <div className={`font-extrabold text-lg ${rVal > 0.6 ? 'text-rose-600' : (rVal < -0.6 ? 'text-blue-600' : 'text-slate-700')}`}>
                                                    {count > 1 ? rVal.toFixed(2) : '-'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="w-full max-w-2xl bg-white border border-slate-200 rounded-lg p-2 shadow-inner">
                                        <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
                                            {/* 背景グリッド */}
                                            {xTicks.map(t => (
                                                <g key={`x${t}`}>
                                                    <line x1={getX(t)} y1={padT} x2={getX(t)} y2={svgH - padB} stroke="#f1f5f9" strokeWidth="1" />
                                                    <text x={getX(t)} y={svgH - padB + 20} textAnchor="middle" fontSize="11" fill="#94a3b8">{t}</text>
                                                </g>
                                            ))}
                                            {yTicks.map(t => (
                                                <g key={`y${t}`}>
                                                    <line x1={padL} y1={getY(t)} x2={svgW - padR} y2={getY(t)} stroke="#f1f5f9" strokeWidth="1" />
                                                    <text x={padL - 10} y={getY(t) + 4} textAnchor="end" fontSize="11" fill="#94a3b8">{t}</text>
                                                </g>
                                            ))}
                                            
                                            {/* 平均線のクロス */}
                                            {count > 0 && (
                                                <>
                                                    <line x1={getX(avgX)} y1={padT} x2={getX(avgX)} y2={svgH - padB} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.6" />
                                                    <line x1={padL} y1={getY(avgY)} x2={svgW - padR} y2={getY(avgY)} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.6" />
                                                    <text x={getX(avgX) + 5} y={padT + 10} fontSize="10" fill="#ef4444" fontWeight="bold">X平均: {avgX.toFixed(1)}</text>
                                                    <text x={svgW - padR - 5} y={getY(avgY) - 5} textAnchor="end" fontSize="10" fill="#ef4444" fontWeight="bold">Y平均: {avgY.toFixed(1)}</text>
                                                </>
                                            )}

                                            {/* 軸ラベル */}
                                            <text x={svgW / 2} y={svgH - 10} textAnchor="middle" fontSize="14" fontWeight="bold" fill="#3b82f6">【X軸】 {scatterXSubject}</text>
                                            <text x={15} y={svgH / 2} textAnchor="middle" transform={`rotate(-90 15 ${svgH / 2})`} fontSize="14" fontWeight="bold" fill="#db2777">【Y軸】 {scatterYSubject}</text>

                                            {/* ドット（生徒） */}
                                            {points.map((p, idx) => (
                                                <circle key={idx} cx={getX(p.x)} cy={getY(p.y)} r="5.5" fill="#6366f1" opacity="0.65" stroke="#ffffff" strokeWidth="1">
                                                    <title>{scatterXSubject}: {p.x} / {scatterYSubject}: {p.y}</title>
                                                </circle>
                                            ))}
                                        </svg>
                                    </div>
                                    <div className="mt-3 text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-md">
                                        ※ ドットにカーソルを合わせると点数が表示されます（個人名は表示されません）
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                </div>
            );
        };

        // --- ランキング表セクション表示コンポーネント（画面＆印刷共用） ---
        const RankingSectionView = ({ section, isPrint = false, onSelectStudent = null, hideNames = false }) => {
            if (!section || !section.columns || section.columns.length === 0) return null;

            // 全カラムの中で最大の表示行数（最低20行、20位タイが複数いればその人数分）を算出
            const maxRows = useMemo(() => {
                let maxLen = 20;
                section.columns.forEach(col => {
                    if (col.topList.length > maxLen) {
                        maxLen = col.topList.length;
                    }
                });
                return maxLen;
            }, [section]);

            const rowIndices = Array.from({ length: maxRows }, (_, i) => i);
            const colCount = section.columns.length;

            // 印刷時にA4縦1枚の高さ（余白を除いた安全領域）を最大限使い切るための1行あたりの高さを動的算出
            const printRowHeight = useMemo(() => {
                if (!isPrint) return null;
                // A4縦の印刷可能領域からタイトル・ヘッダー・平均フッターを引いた残り高さをデータ行数で割る
                const availableBodyHeight = section.isBenesse ? 830 : 845;
                return Math.max(24, Math.min(43, Math.floor(availableBodyHeight / maxRows)));
            }, [isPrint, maxRows, section.isBenesse]);

            // 順位バッジのスタイル
            const renderRankBadge = (rank) => {
                if (!rank) return <span className="text-slate-300">-</span>;
                const badgeSize = isPrint ? 'w-[17px] h-[17px] text-[10px]' : 'w-[18px] h-[18px] text-[10.5px]';
                if (rank === 1) {
                    return <span className={`inline-flex items-center justify-center rounded-full bg-amber-400 text-slate-900 font-extrabold shadow-sm ${badgeSize}`}>1</span>;
                }
                if (rank === 2) {
                    return <span className={`inline-flex items-center justify-center rounded-full bg-slate-300 text-slate-800 font-extrabold shadow-sm ${badgeSize}`}>2</span>;
                }
                if (rank === 3) {
                    return <span className={`inline-flex items-center justify-center rounded-full bg-amber-700/80 text-white font-extrabold shadow-sm ${badgeSize}`}>3</span>;
                }
                return <span className="font-bold text-slate-500 text-[10.5px]">{rank}</span>;
            };

            // 氏名が長い生徒（5文字以上など）でも見切れずにフルネームで収まるよう文字サイズと横幅倍率を自動調整する関数
            const renderFittedName = (rawName) => {
                if (!rawName) return <span className="text-slate-300">-</span>;
                const parts = rawName.trim().split(/[\s　]+/);
                const pureChars = parts.join('');
                const len = pureChars.length;
                const hasSpace = parts.length > 1;

                // カラム数に応じて氏名欄に確実に収まる基準幅(px)を設定（4文字がジャスト収まる幅を基準化）
                const availW = colCount >= 6 ? 47 : (colCount === 5 ? 62 : 72);
                // 姓名間のスペース幅（5文字以上は隙間を最小限にして文字領域を確保）
                const spacePx = hasSpace ? (len >= 5 ? 1.5 : 3) : 0;
                const baseFontSize = colCount >= 6 ? 11.5 : 12;

                let fontSize = baseFontSize;
                let scaleX = 1;
                let letterSpacing = '0px';

                if (len >= 5) {
                    // 5文字以上は文字数に応じてフォントサイズと横幅倍率を確実に縮小して見切れを防止
                    fontSize = colCount >= 6 ? (len === 5 ? 10.2 : 9.5) : (len === 5 ? 11 : 10);
                    letterSpacing = '-0.3px';
                    const charW = fontSize - 0.3;
                    const afterFontW = len * charW + spacePx;
                    if (afterFontW > availW) {
                        scaleX = Math.max(0.55, Number((availW / afterFontW).toFixed(2)));
                    }
                } else {
                    const estimatedW = len * baseFontSize + spacePx;
                    if (estimatedW > availW) {
                        scaleX = Math.max(0.75, Number((availW / estimatedW).toFixed(2)));
                    }
                }

                return (
                    <div
                        className="font-bold text-slate-800 whitespace-nowrap leading-none flex items-center"
                        style={{
                            fontSize: `${fontSize}px`,
                            letterSpacing,
                            transform: scaleX < 1 ? `scaleX(${scaleX})` : 'none',
                            transformOrigin: 'left center',
                            width: scaleX < 1 ? `${Math.round(100 / scaleX)}%` : '100%'
                        }}
                    >
                        {parts.map((part, idx) => (
                            <span key={idx} style={{ marginLeft: idx > 0 ? `${spacePx}px` : '0px' }}>
                                {part}
                            </span>
                        ))}
                    </div>
                );
            };

            return (
                <div className={`${isPrint ? 'mb-0' : 'mb-8'}`}>
                    {/* セクション見出し */}
                    <div className={`flex flex-wrap items-center justify-between gap-2 ${isPrint ? 'mb-2 pb-1.5 border-b-2 border-slate-800' : 'mb-3 pb-2 border-b-2 border-slate-200'}`}>
                        <div className="flex items-center gap-2.5">
                            <span className={`inline-flex items-center justify-center w-7 h-7 rounded-lg text-white font-bold shadow-sm ${section.badgeColor || 'bg-amber-500'}`}>
                                🏆
                            </span>
                            <div>
                                <h3 className={`${isPrint ? 'text-lg' : 'text-base sm:text-lg'} font-extrabold text-slate-800 leading-tight`}>
                                    {section.title}
                                </h3>
                                <p className="text-[11px] text-slate-500 font-medium">
                                    {section.subtitle}（同点は同順位表示・下部に受験者平均を表示）
                                </p>
                            </div>
                        </div>
                        {section.filterLabel && (
                            <span className="text-xs font-bold bg-slate-100 text-slate-700 border border-slate-300 px-2.5 py-1 rounded-full">
                                対象: {section.filterLabel}
                            </span>
                        )}
                    </div>

                    {/* ランキンググリッドテーブル */}
                    <div className={isPrint ? 'w-full' : 'overflow-x-auto pb-1'}>
                        <div
                            className={`grid ${isPrint ? 'gap-1 w-full' : 'gap-1.5 min-w-[720px]'}`}
                            style={{ gridTemplateColumns: `repeat(${colCount}, minmax(0, 1fr))` }}
                        >
                            {section.columns.map(col => (
                                <div key={col.key} className="bg-white rounded-lg border border-slate-300 shadow-sm overflow-hidden flex flex-col">
                                    {/* 教科ヘッダー */}
                                    <div className={`px-2 ${isPrint ? 'py-2 text-sm' : 'py-1.5 text-xs sm:text-sm'} text-center font-extrabold border-b-2 ${col.headerStyle}`}>
                                        {col.label}
                                    </div>

                                    {/* カラムサブヘッダー */}
                                    <div className="flex items-center bg-slate-100 text-slate-600 text-[10px] font-bold py-1 px-0.5 border-b border-slate-200">
                                        <div className="w-[18px] shrink-0 text-center">順</div>
                                        {!hideNames && <div className="flex-1 min-w-0 text-left pl-0.5">氏名</div>}
                                        {section.isBenesse ? (
                                            <>
                                                <div className={`${hideNames ? 'flex-1 text-center' : 'w-[25px] shrink-0 text-right'}`}>点数</div>
                                                <div className={`${hideNames ? 'flex-1 text-center' : 'w-[32px] shrink-0 text-right pr-0.5'}`}>偏差値</div>
                                            </>
                                        ) : (
                                            <div className={`${hideNames ? 'flex-1 text-right pr-2' : 'w-[25px] shrink-0 text-right pr-0.5'}`}>点数</div>
                                        )}
                                    </div>

                                    {/* 1位〜20位リスト */}
                                    <div className="divide-y divide-slate-100 flex-1 flex flex-col">
                                        {rowIndices.map(rowIdx => {
                                            const item = col.topList[rowIdx];
                                            const isEven = rowIdx % 2 === 1;
                                            const rowStyle = isPrint && printRowHeight ? { height: `${printRowHeight}px` } : {};

                                            if (!item) {
                                                return (
                                                    <div
                                                        key={rowIdx}
                                                        style={rowStyle}
                                                        className={`flex items-center px-0.5 ${isPrint ? '' : 'py-1.5'} text-[11px] ${isEven ? 'bg-slate-50/50' : 'bg-white'}`}
                                                    >
                                                        <div className="w-[18px] shrink-0 text-center text-slate-300 text-[10px]">{rowIdx + 1}</div>
                                                        <div className="flex-1 text-center text-slate-300 text-[10px]">-</div>
                                                    </div>
                                                );
                                            }

                                            const isTop3 = item.rank <= 3;
                                            return (
                                                <div
                                                    key={`${item.studentId}_${rowIdx}`}
                                                    style={rowStyle}
                                                    onClick={() => !isPrint && !hideNames && onSelectStudent && onSelectStudent(item.studentId)}
                                                    className={`flex items-center px-0.5 ${isPrint ? '' : 'py-1.5'} text-[11.5px] transition-colors ${
                                                        !isPrint && !hideNames && onSelectStudent ? 'cursor-pointer hover:bg-blue-50' : ''
                                                    } ${isTop3 ? 'bg-amber-50/40' : (isEven ? 'bg-slate-50/60' : 'bg-white')}`}
                                                    title={!isPrint && !hideNames ? `${item.grade}-${item.class}-${item.no} ${item.rawName} (クリックで個人成績へ)` : ''}
                                                >
                                                    <div className="w-[18px] shrink-0 flex justify-center items-center">
                                                        {renderRankBadge(item.rank)}
                                                    </div>
                                                    {!hideNames && (
                                                        <div className="flex-1 min-w-0 text-left pl-0.5 pr-0.5 overflow-hidden">
                                                            {renderFittedName(item.rawName)}
                                                        </div>
                                                    )}
                                                    {section.isBenesse ? (
                                                        <>
                                                            <div className={`${hideNames ? 'flex-1 text-center text-xs' : 'w-[25px] shrink-0 text-right text-[11px]'} font-extrabold text-slate-800 font-mono tracking-tighter`}>
                                                                {Math.round(item.score)}
                                                            </div>
                                                            <div className={`${hideNames ? 'flex-1 text-center text-xs' : 'w-[32px] shrink-0 text-right pr-0.5 text-[10.5px]'} font-extrabold text-emerald-700 font-mono tracking-tighter`}>
                                                                {item.dev !== null ? Number(item.dev).toFixed(1) : '-'}
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <div className={`${hideNames ? 'flex-1 text-right pr-2 text-xs' : 'w-[25px] shrink-0 text-right pr-0.5 text-[11.5px]'} font-extrabold font-mono tracking-tighter ${col.isTotal ? 'text-blue-700' : 'text-slate-900'}`}>
                                                            {Math.round(item.score)}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* 最下部：平均点・平均偏差値フッター */}
                                    <div className={`bg-slate-800 text-white px-2 ${isPrint ? 'py-2.5' : 'py-2'} border-t-2 border-slate-900 mt-auto`}>
                                        {section.isBenesse ? (
                                            <div className="flex flex-col gap-0.5">
                                                <div className="flex justify-between items-baseline text-[11px]">
                                                    <span className="text-slate-300 font-bold">平均点</span>
                                                    <span className="font-extrabold text-amber-300 font-mono text-xs">
                                                        {col.avgScore !== null ? `${col.avgScore}点` : '-'}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between items-baseline text-[11px] border-t border-slate-700 pt-0.5">
                                                    <span className="text-slate-300 font-bold">平均偏差値</span>

            );
        };

        // --- Main Application Component ---
        const App = () => {
            // Cohort State (v5.3: 複数期生の管理 + 編集・削除用の状態変数を完備)
            const [cohorts, setCohorts] = useState([{ id: 'cohort_default', name: '29期生', order: 0 }]);

            const [newCohortNameInput, setNewCohortNameInput] = useState('');
            const [editingCohortId, setEditingCohortId] = useState(null);
            const [editingCohortName, setEditingCohortName] = useState('');
            const [confirmDeleteCohortId, setConfirmDeleteCohortId] = useState(null);

            // Cross-Cohort Comparison State (過年度比較 パターンA)

            const [compareConfig, setCompareConfig] = useState({

                baseCohortId: 'cohort_default',

            });

            // Class Comparison State (v5.3: 同じ期生内でのA組 vs B組 クラス間比較)
            const [isClassCompareOpen, setIsClassCompareOpen] = useState(false);
            const [classCompareConfig, setClassCompareConfig] = useState({
                examType: 'regular',
                mode: 'single',
                selectedExamId: '',
                singleSubTab: 'overview',
                overviewStatKey: 'avg',
                distSubject: '5教科平均点',
                trendSubject: '5教科平均点',
                trendMetricType: 'average',
                trendThreshold: 80,
                trendTopN: 20
            });

            // State
            const [exams, setExams] = useState([]); // [{ id, name, type, order, cohortId }]
            const [records, setRecords] = useState([]); // [{ examId, studentId, rawName, grade, class, no, scholarship, scores: {} }]
            const [activeTab, setActiveTab] = useState('regular'); // 'regular' or 'benesse' or 'comprehensive'
            const [selectedExamId, setSelectedExamId] = useState(null);
            const [selectedStudentId, setSelectedStudentId] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: 'class_no', direction: 'asc' });
            
            // UI State
            const [importExamName, setImportExamName] = useState('');
            const [isDlMenuOpen, setIsDlMenuOpen] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const fileInputRef = useRef(null);

            // Print State (v4.0 / v5.0)
            const [isPrinting, setIsPrinting] = useState(false);
            const [printModeType, setPrintModeType] = useState('report'); // 'report' | 'ranking' | 'cohort_compare'
            const [printTargetIds, setPrintTargetIds] = useState([]); 
            const [printTargetTypes, setPrintTargetTypes] = useState({ regular: true, benesse: true, comprehensive: true });
            const [printIncludeCharts, setPrintIncludeCharts] = useState(true);
            // Ranking Modal State (v4.3 / v5.4)
            const [isRankingOpen, setIsRankingOpen] = useState(false);
            const [rankingClassFilter, setRankingClassFilter] = useState('ALL');
            const [isRankingNameHidden, setIsRankingNameHidden] = useState(false);
            
            const [isPrintMenuOpen, setIsPrintMenuOpen] = useState(false);
            const [printConfig, setPrintConfig] = useState({
                types: { regular: true, benesse: true, comprehensive: true },
                includeCharts: true, // true = 各試験シートに一覧表＋グラフを統合表示, false = 一覧表のみ表示
                mode: 'all', // 'all', 'class', 'individual'
                targetClass: '',
                selectedStudents: []
            });

            // Student Dashboard State (v5.5)
            const [isStudentDashboardOpen, setIsStudentDashboardOpen] = useState(false);
            const [dashboardConfig, setDashboardConfig] = useState({
                mode: 'histogram',
                examId: '',
                histSubject: '5教科総点',
                scatterXSubject: '数学',
                scatterYSubject: '英語'
            });

            // Settings & Sync State
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isFirebaseConfigOpen, setIsFirebaseConfigOpen] = useState(true);
            const [firebaseConfig, setFirebaseConfig] = useState('');
            const [isFirebaseEnabled, setIsFirebaseEnabled] = useState(true);
            const [syncId, setSyncId] = useState('');

            // Click outside to close Download Menu
            useEffect(() => {
                const handleClickOutside = () => setIsDlMenuOpen(false);
                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, []);

            // Load data from localStorage
            useEffect(() => {
                let loadedCohorts = [{ id: 'cohort_default', name: '29期生', order: 0 }];
                try {
                    const savedCohorts = localStorage.getItem('blend_cohorts');
                    if (savedCohorts) {
